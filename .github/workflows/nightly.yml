# Nightly jobs (guide sections 8 and 17): evals against a real model (a scripted model runs in CI),
# a dependency rescan that catches advisories published against unchanged code, the contract
# property tests with random inputs and more examples than CI runs, and the rulebook data-quality
# checks. When a job fails, the report job opens one issue labelled nightly-failure, or comments
# on the one already open; data-quality violations also label it data-quality, for Regulatory
# Intelligence.
# The evals need the repository secret CW_AI_GATEWAY_API_KEY (a Vercel AI Gateway key); until the
# maintainer adds it the job prints what to do and exits green, so the schedule never pages anyone
# for a missing account.
name: nightly

on:
  schedule:
    - cron: "0 21 * * *" # 02:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals-nightly:
    name: Evals (real provider through the llm-gateway, section 8 thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - name: Provider key present?
        id: key
        env:
          CW_AI_GATEWAY_API_KEY: ${{ secrets.CW_AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$CW_AI_GATEWAY_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Nightly evals skipped"
              echo
              echo "No CW_AI_GATEWAY_API_KEY repository secret. Manual steps: create a Vercel AI Gateway key,"
              echo "add it as the repository secret CW_AI_GATEWAY_API_KEY, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the llm-gateway with the real provider
        if: steps.key.outputs.present == 'true'
        env:
          CW_LLM_PROVIDER: vercel
          CW_AI_GATEWAY_API_KEY: ${{ secrets.CW_AI_GATEWAY_API_KEY }}
          CW_LLM_LEDGER: memory
          CW_LOG_JSON: "true"
        run: |
          nohup uv run --package compliancewatch-llm-gateway uvicorn llm_gateway.main:app --port 8008 > gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8008/ready && break
            sleep 1
          done
      - name: Eval harness, nightly profile
        if: steps.key.outputs.present == 'true'
        run: make eval EVAL_PROFILE=nightly ARGS="--gateway-url http://localhost:8008"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report-nightly
          path: |
            evals/reports/
            gateway.log
          if-no-files-found: ignore

  dependency-rescan:
    name: Dependency and config rescan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # upload-sarif reads the workflow run; a private repository requires it
      security-events: write # findings go to code scanning
    steps:
      - uses: actions/checkout@v7
      # The dependency-scan job of ci.yml runs only when a lockfile, a Dockerfile or the Trivy
      # settings change. This run repeats it every night against the day's advisory database.
      - name: Vulnerabilities and misconfigurations (fails on a finding)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          version: v0.74.0 # keep in step with TRIVY_IMAGE in the Makefile
          cache-dir: ${{ runner.temp }}/trivy
      - name: The same findings as SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          limit-severities-for-sarif: "true"
          skip-setup-trivy: "true"
          cache: "false" # the first step restored the database into cache-dir
          cache-dir: ${{ runner.temp }}/trivy
      - name: Findings to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

  contract-fuzz:
    name: Contract property tests (nightly Hypothesis profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      # CI runs 25 derandomized examples per API operation; the nightly profile (root
      # conftest.py) runs 200 random ones, so each night tries new inputs. A failure prints the
      # example and the blob that reproduces it.
      - name: Contract tests, schemathesis properties included
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -m contract

  data-quality:
    name: Rulebook data quality (versions, citations, relations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # true only when the checks ran and found a violation (exit code 1), not when the database
      # could not be read (exit code 2); the report job labels the issue data-quality from it.
      violations: ${{ steps.checks.outputs.violations }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      # With the repository secret CW_DQ_DATABASE_URL (a read-only role on a deployed rulebook,
      # postgresql+psycopg://...) the checks read that database. Without it they read a fresh
      # Postgres with the migrations and the seed calendar, which keeps the checks and the seed
      # honest until a deployed rulebook exists.
      - name: Database to check
        id: target
        env:
          CW_DQ_DATABASE_URL: ${{ secrets.CW_DQ_DATABASE_URL }}
        run: |
          if [ -n "$CW_DQ_DATABASE_URL" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "Checking the database in CW_DQ_DATABASE_URL." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "No CW_DQ_DATABASE_URL secret: checking the migrated seed calendar." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Postgres with the rulebook migrated and the seed calendar loaded
        if: steps.target.outputs.deployed == 'false'
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres
          make migrate SERVICE=rulebook
          make seed SERVICE=rulebook
      # The command runs directly, with the environment `make data-quality` sets, because make
      # exits 2 for any failed recipe: its own exit code tells a violation (1) from a database
      # that could not be read (2). Either fails the job.
      - name: Data-quality checks (a violation or an unreadable database fails the job)
        id: checks
        env:
          CW_DQ_DATABASE_URL: ${{ secrets.CW_DQ_DATABASE_URL }}
          CW_DB_SCHEMA: rulebook
          CW_LOG_LEVEL: WARNING
        run: |
          export CW_DATABASE_URL="${CW_DQ_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-cw}:${POSTGRES_PASSWORD:-cw}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-compliancewatch}}"
          status=0
          uv run --package compliancewatch-rulebook rulebook-quality --json > data-quality.json || status=$?
          if [ "$status" -eq 1 ]; then
            echo "violations=true" >> "$GITHUB_OUTPUT"
          else
            echo "violations=false" >> "$GITHUB_OUTPUT"
          fi
          cat data-quality.json
          {
            echo "## Rulebook data quality"
            echo
            jq -r '.checks[] | "- \(.check): \(.violations) violation(s)"' data-quality.json || true
            echo
            echo "Runbook: docs/runbooks/rulebook-data-quality.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-quality-report
          path: data-quality.json
          if-no-files-found: ignore
      - name: Teardown
        if: always() && steps.target.outputs.deployed == 'false'
        run: docker compose down --volumes --remove-orphans

  report:
    name: Open or update the nightly-failure issue
    needs: [evals-nightly, dependency-rescan, contract-fuzz, data-quality]
    # Runs when a job failed or timed out, for the schedule and for manual runs on main; a manual
    # run on another branch is watched by whoever started it, and a run cancelled by hand reports
    # nothing.
    if: >-
      !cancelled() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: One open issue labelled nightly-failure, with a comment for each failing night
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # true for violations (exit code 1), false when the database could not be read (exit code 2)
          DATA_QUALITY_VIOLATIONS: ${{ needs.data-quality.outputs.violations == 'true' }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- \(.key): \(.value.result)"' <<< "$NEEDS")
          body=$(printf 'The nightly run of %s failed.\n\n%s\n\nRun: %s\n' "$(date -u +%Y-%m-%d)" "$failed" "$RUN_URL")
          gh label create nightly-failure --color B60205 --description "A job in the nightly workflow failed" --force
          # Rulebook data-quality violations go to Regulatory Intelligence
          # (docs/runbooks/rulebook-data-quality.md).
          if [ "$DATA_QUALITY_VIOLATIONS" = "true" ]; then
            gh label create data-quality --color FBCA04 --description "Rulebook data-quality checks found violations (Regulatory Intelligence)" --force
          fi
          number=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            if [ "$DATA_QUALITY_VIOLATIONS" = "true" ]; then
              gh issue edit "$number" --add-label data-quality
            fi
          elif [ "$DATA_QUALITY_VIOLATIONS" = "true" ]; then
            gh issue create --title "Nightly run failing" --label nightly-failure --label data-quality --body "$body"
          else
            gh issue create --title "Nightly run failing" --label nightly-failure --body "$body"
          fi
