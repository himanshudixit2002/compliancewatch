# CI (guide section 17). Implemented: 1 lint + type-check, 2 unit tests with coverage gate,
# 3 contract checks (import-linter; OpenAPI diff, event-schema compatibility and migration lint are
# TODO), a compose dev-stack smoke, and secrets scanning. Steps 4-7 are listed as TODO at the end.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      devstack: ${{ steps.filter.outputs.devstack }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'services/**'
              - 'packages/domain-kernel/**'
              - 'packages/ontology/**'
              - 'packages/py-common/**'
              - 'packages/contracts/**'
              - 'evals/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'conftest.py'
              - '.github/workflows/ci.yml'
            typescript:
              - 'apps/**'
              - 'packages/ui/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.prettierignore'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            devstack:
              - 'docker-compose.yml'
              - 'infra/dev/**'
              - '.env.example'
              - 'Makefile'
              - 'services/*/migrations/**'
              - 'services/*/alembic.ini'
              - '.github/workflows/ci.yml'

  python:
    name: Python (ruff, mypy, import-linter, pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - name: Lint and format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check (mypy --strict; targets from [tool.mypy] in pyproject.toml)
        run: uv run mypy
      - name: Contract check - import boundaries (import-linter)
        run: uv run lint-imports
      # TODO(section 17 step 3): OpenAPI diff, event-schema compatibility, migration lint (tenant_id + RLS).
      - name: Unit tests with coverage gate (80% on domain and application layers, guide section 19)
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  typescript:
    name: TypeScript (eslint, tsc, vitest, build)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check (prettier)
        run: pnpm format
      - name: Lint, type-check, unit tests with coverage gate, build (Turborepo, per package)
        run: pnpm turbo run lint typecheck test build

  dev-stack:
    name: Dev stack (docker compose smoke + migrations)
    needs: changes
    if: needs.changes.outputs.devstack == 'true'
    runs-on: ubuntu-latest # has docker + compose v2
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose --profile observability config -q
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Schemas, pgvector, Redpanda and Temporal are up
        run: |
          schemas=$(docker compose exec -T postgres psql -U cw -d compliancewatch -Atc "select string_agg(nspname, ',' order by nspname) from pg_namespace where nspname not like 'pg\_%' and nspname <> 'information_schema'")
          echo "schemas: $schemas"
          test "$schemas" = "applicability,audit,eval,identity,llm_gateway,notification,obligation,pipeline,profile,public,qa,rulebook"
          docker compose exec -T postgres psql -U cw -d compliancewatch -Atc "select extversion from pg_extension where extname = 'vector'" | grep -E '^[0-9]'
          docker compose exec -T redpanda rpk cluster health
          docker compose exec -T temporal temporal operator cluster health --address temporal:7233
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Run every service's migrations against the stack
        run: |
          uv sync --all-packages --locked
          make migrate
      - name: Logs and teardown
        if: always()
        run: |
          docker compose logs --no-color | tail -200
          docker compose down -v

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1" # keep in step with .pre-commit-config.yaml
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false" # PR comments need pull-requests: write; summary + SARIF suffice
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # required only once the repo moves under a GitHub organisation

# -----------------------------------------------------------------------------------------------
# TODO (guide section 17, steps 4-7) - deliberately not implemented in Phase 0:
#   4. integration: testcontainers (Postgres, Redpanda, Temporal test server) for affected services,
#                   e.g. `uv run pytest -m integration` (Docker is available on ubuntu-latest)
#   5. evals:       run evals/harness when paths change under services/pipeline/prompts/**, services/qa/**,
#                   services/applicability-engine/** or evals/**; section 8 thresholds block the merge
#   6. images:      per-service image build, SBOM (syft), Trivy scan, cosign sign, push to ECR
#   7. deploy:      Argo CD sync to staging, Playwright e2e and k6 smoke against staging
# -----------------------------------------------------------------------------------------------
