# CI (guide section 17). Implemented: 1 lint + type-check, 2 unit tests with coverage gate,
# 3 contract checks (import-linter; the OpenAPI spec per service through its contract test, a
# committed spec for every service that serves API routes, and backward compatibility of the specs
# against the base branch; the event schemas: metaschema, a schema for every event topic in code,
# golden examples, generated clients in sync, backward compatibility against the base branch by
# example replay and by the Redpanda schema registry; the migration lint's file rules in the ops
# job and its catalog rules in the dev-stack job), 4 integration tests (testcontainers) for the
# packages a change affects, an ops job (runbook links, promtool rules, actionlint), a compose
# dev-stack smoke that builds the one deployable's image, runs its release on the fresh stack and
# the product from it (make product-image, product-seed, product-check: a published rule becomes
# decisions, obligations and a change card through the image's worker) and the web app's real-data
# journey on it (make product-e2e), secrets scanning, SAST
# (semgrep) and a dependency and config scan (trivy), both reported to code scanning, and the web
# e2e job (Playwright with axe against the built Next.js app, with every service running on memory
# stores and seeded with the demo tenant). The job "CI gate" needs every other job and is the one
# check branch protection requires;
# infra/scripts/check_ci_gate.py fails when a job is missing from its needs.
# Steps 5-7 are listed as TODO at the end.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      devstack: ${{ steps.filter.outputs.devstack }}
      contracts: ${{ steps.filter.outputs.contracts }}
      schemas: ${{ steps.filter.outputs.schemas }}
      evals: ${{ steps.filter.outputs.evals }}
      ops: ${{ steps.filter.outputs.ops }}
      integration_targets: ${{ steps.integration.outputs.targets }}
      sast: ${{ steps.filter.outputs.sast }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'services/**'
              - 'composition/**' # the one deployable (ADR-013): composition/mvp hosts every service
              - 'packages/domain-kernel/**'
              - 'packages/ontology/**'
              - 'packages/py-common/**'
              - 'packages/contracts/**'
              - 'evals/**'
              - 'tools/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'conftest.py'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - 'infra/scripts/**' # the repository checks: ruff, mypy and their unit tests
              - '.trivyignore.yaml' # its unit test holds every entry to a statement and an expiry
              - 'packages/flags/**' # make flags-check: the registry against the settings modules
              - 'infra/dev/postgres/**' # the service roles' files, which py-common's unit tests read
            typescript:
              - 'apps/**'
              - 'packages/ui/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.prettierignore'
              - '.nvmrc'
              - '**/*.yml' # prettier --check . also covers YAML outside the packages
              - '**/*.yaml'
              - '.github/workflows/ci.yml'
              - 'packages/flags/**'
              - 'docs/legal/**' # next build renders them on /legal/[doc]; legal.test.ts reads them
              - 'docs/web/**' # screens-doc.test.ts and web-screens-check compare screens.md with the registry
            contracts:
              - 'packages/contracts/**'
              - 'packages/py-common/**'
              - 'packages/domain-kernel/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - 'services/*/src/**' # check_topics: every event class in code has a schema
              - 'packages/*/src/**'
            schemas:
              - 'packages/contracts/events/schemas/**'
            evals:
              - 'evals/**'
              - 'services/pipeline/**'
              - 'services/llm-gateway/prompts/**'
              - 'services/llm-gateway/src/**'
              - 'services/rulebook/**'
              - 'services/qa/**'
              - 'services/profile/**'
              - 'services/obligation/**'
              - 'services/applicability-engine/**'
              - 'packages/domain-kernel/**'
              - 'packages/ontology/**'
              - 'packages/py-common/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            devstack:
              - 'docker-compose.yml'
              - 'infra/dev/**'
              - '.env.example'
              - '.dockerignore'
              - 'Makefile'
              - 'services/*/migrations/**'
              - 'services/*/alembic.ini'
              - 'packages/contracts/events/schemas/**' # registry compatibility step
              # The fake-llm image is built from these (the llm-gateway Dockerfile copies them)
              - 'services/llm-gateway/**'
              - 'packages/py-common/**'
              - 'packages/domain-kernel/**'
              - 'packages/ontology/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
              # make product-check runs every service through the deployable's image and its
              # worker, with cw-product (tools/demo) publishing from the golden world (evals)
              - 'services/**'
              - 'composition/**'
              - 'packages/contracts/clients/python/**' # in the image
              - 'tools/demo/**'
              - 'evals/**'
              # make product-e2e runs the web app's real-data journey on that product
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'
            ops:
              - 'infra/**'
              - 'docs/runbooks/**'
              - 'services/*/migrations/**'
              - '.github/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'docker-compose.yml' # alerts-check runs promtool from the compose Prometheus image
            sast: # code the semgrep packs and the rules in .semgrep read
              - 'services/**'
              - 'composition/**'
              - 'packages/**'
              - 'apps/**'
              - 'evals/**'
              - 'tools/**'
              - 'infra/**'
              - 'conftest.py'
              - 'eslint.config.mjs'
              - '.semgrep/**'
              - '.semgrepignore'
              - '.github/workflows/**'
              - 'Makefile'
            dependencies: # what trivy reads: lockfiles, Dockerfiles, infrastructure config
              - 'uv.lock'
              - 'pnpm-lock.yaml'
              - '**/Dockerfile'
              - 'infra/**'
              - '.trivy.yaml'
              - '.trivyignore.yaml'
              - '.github/workflows/ci.yml'
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          list-files: json
          filters: |
            any:
              - '**'
      - name: Integration test targets the change affects
        id: integration
        env:
          CHANGED: ${{ steps.changed.outputs.any_files }}
        # Every directory holding tests/integration is a target. A change to a shared path runs all
        # of them (infra/dev/postgres too: the tests connect as the roles its roles.sql makes);
        # otherwise a target runs when a changed file lies under its directory.
        run: |
          all=$(git ls-files '*/tests/integration/*.py' | sed 's#/tests/integration/.*##' | sort -u \
            | jq -Rcs 'split("\n") | map(select(length > 0))')
          shared='^(packages/(py-common|domain-kernel|ontology)/|infra/dev/postgres/|(pyproject\.toml|uv\.lock|\.python-version|conftest\.py|Makefile|\.github/workflows/ci\.yml)$)'
          if jq -e --arg shared "$shared" 'any(.[]; test($shared))' <<< "$CHANGED" > /dev/null; then
            targets=$all
          else
            targets=$(jq -c --argjson changed "$CHANGED" \
              '[.[] as $dir | select(any($changed[]; startswith($dir + "/"))) | $dir]' <<< "$all")
          fi
          echo "integration targets: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  python:
    name: Python (ruff, mypy, import-linter, pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      # The same gates as `make check` locally (py- side): ruff, per-package mypy --strict (src, tests,
      # migrations/env.py), import-linter, pytest with the 80% coverage gate, uv lock check.
      - name: Lint and format check (ruff)
        run: make py-lint
      - name: Type-check (mypy --strict per package)
        run: make py-typecheck
      - name: Contract check - import boundaries (import-linter)
        run: make importlint
      # Section 17 step 3: the OpenAPI spec is covered per service by its contract test (pytest
      # step); the event schemas by the contracts job below; migration files by the ops job, and
      # tenant_id and row-level security by the migration lint after the dev-stack migrations.
      - name: Unit tests with coverage gate (80% on domain and application layers, guide section 19)
        run: make py-test
      - name: Lockfile is current
        run: make lock-check
      # A service that serves more than health, ready and ping commits its OpenAPI spec and the
      # contract test that pins it; the check imports each app and lists the routes it serves.
      - name: Contract check - every service with API routes has a committed spec
        run: make openapi-check
      # Every bool *_enabled or provider switch in a settings module has a registry entry with an
      # owner, a false default and an unexpired removal date; py-common's copy is current.
      - name: Feature flag registry (owners, defaults, expiry, every switch registered)
        run: make flags-check

  evals:
    name: Evals (golden sets, scripted and fake provider, section 8 gates)
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - name: Golden cases are well formed
        run: make label ARGS="check"
      - name: KAG golden set and world are well formed
        run: make eval-check
      # Section 17 step 5: the harness runs the labelled cases with the scripted answers (proves
      # the scoring) and the in-process gateway with the fake provider (proves the plumbing, no
      # tokens). Section 8 thresholds against a real model run nightly (nightly.yml).
      - name: Eval harness, ci profile
        run: make eval EVAL_PROFILE=ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: evals/reports/
          if-no-files-found: ignore

  typescript:
    name: TypeScript (eslint, tsc, vitest, build)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check (prettier)
        run: pnpm format
      - name: Lint, type-check, unit tests with coverage gate, build (Turborepo, per package)
        run: pnpm turbo run lint typecheck test build

  contracts:
    name: Contracts (event schemas, generated clients, event and OpenAPI compatibility)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the compatibility check reads the base branch's schemas and examples
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: pnpm/action-setup@v6 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - name: Schemas pass the 2020-12 metaschema, every topic in code has one, and the generated clients match them
        run: make contracts-check
      - name: Examples and generated models agree with the schemas
        run: uv run pytest packages/contracts -q
      - name: Backward compatible with the base branch (base examples replayed against these schemas)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python packages/contracts/scripts/check_compat.py --base-ref "origin/$BASE_REF"
      - name: OpenAPI specs break no client of the base branch (deliberate breaks listed in BREAKING.md)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python packages/contracts/scripts/check_openapi_compat.py --base-ref "origin/$BASE_REF"

  integration:
    name: Integration tests (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.integration_targets != '[]'
    runs-on: ubuntu-latest # testcontainers uses the runner's Docker; no compose stack
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.integration_targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - name: Temporal CLI version, when the target starts a local Temporal server
        id: temporal
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if grep -rqs WorkflowEnvironment "$TARGET/tests/integration"; then
            version=$(awk '$0 == "name = \"temporalio\"" { getline; gsub(/^version = "|"$/, ""); print; exit }' uv.lock)
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      # WorkflowEnvironment.start_local downloads the Temporal CLI into the temporary directory
      # (TMPDIR below), named after the temporalio version.
      - uses: actions/cache@v6
        if: steps.temporal.outputs.version != ''
        with:
          path: ${{ runner.temp }}/temporal-sdk-python-${{ steps.temporal.outputs.version }}
          key: temporal-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.temporal.outputs.version }}
      # Called without make: the Makefile's TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE default is for
      # Colima, and the hosted runner's socket needs no override.
      - name: Integration tests (testcontainers)
        env:
          TARGET: ${{ matrix.target }}
          TMPDIR: ${{ runner.temp }}
        run: |
          status=0
          uv run pytest -m integration "$TARGET" || status=$?
          # Exit code 5: nothing collected. It fails the job so that a target never passes silently.
          if [ "$status" -eq 5 ]; then
            echo "::error::pytest collected no integration tests under $TARGET"
          fi
          exit "$status"

  ops:
    name: Ops (runbook links, migration lint, promtool rules, actionlint)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest # Docker runs promtool and actionlint from their images
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - name: Every alert links an existing runbook
        run: make runbooks-check
      - name: Migration files (one head per service, names, downgrades, marked contract steps)
        run: make migrations-check
      - name: Every ci.yml job is in the needs of the required check, CI gate
        run: make ci-gate-check
      - name: Alert rules pass promtool check and their unit tests (alerts.test.yml)
        run: make alerts-check
      # The same check as `make ci-lint`, from the image so the runner needs no install. The
      # image bundles shellcheck, so run: scripts are linted too.
      - name: Workflows pass actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  dev-stack:
    name: Dev stack (docker compose smoke, migrations, the local product)
    needs: changes
    if: needs.changes.outputs.devstack == 'true'
    runs-on: ubuntu-latest # has docker + compose v2
    steps:
      - uses: actions/checkout@v7
      # The web app's product journey (make product-e2e, below) builds and runs apps/web.
      - uses: pnpm/action-setup@v6 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose --profile observability config -q
          docker compose --profile llm config -q
          docker compose --profile flags config -q
          docker compose --profile mvp config -q
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Schemas, pgvector, Redpanda and Temporal are up
        run: |
          schemas=$(docker compose exec -T postgres psql -U cw -d compliancewatch -Atc "select string_agg(nspname, ',' order by nspname) from pg_namespace where nspname not like 'pg\_%' and nspname <> 'information_schema'")
          echo "schemas: $schemas"
          test "$schemas" = "applicability,audit,eval,identity,llm_gateway,notification,obligation,pipeline,profile,public,qa,rulebook"
          docker compose exec -T postgres psql -U cw -d compliancewatch -Atc "select extversion from pg_extension where extname = 'vector'" | grep -E '^[0-9]'
          docker compose exec -T redpanda rpk cluster health
          docker compose exec -T temporal temporal operator cluster health --address temporal:7233
      - name: Event schemas are backward compatible in the Redpanda schema registry
        # The base branch's version of each schema is registered under <topic>-value with
        # BACKWARD compatibility, then the PR's version is checked against it. rpk exits 0 either
        # way, so the JSON verdict decides.
        if: github.event_name == 'pull_request' && needs.changes.outputs.schemas == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          rpk() { docker compose exec -T redpanda rpk registry -X registry.hosts=localhost:8081 "$@"; }
          status=0
          for schema in packages/contracts/events/schemas/*.json; do
            name=$(basename "$schema" .json)
            topic=${name%.v*}
            subject="${topic}-value"
            if ! git cat-file -e "origin/$BASE_REF:$schema" 2>/dev/null; then
              echo "$name: new on this branch, nothing to compare"; continue
            fi
            git show "origin/$BASE_REF:$schema" > /tmp/base-schema.json
            docker compose cp /tmp/base-schema.json redpanda:/tmp/base-schema.json
            docker compose cp "$schema" redpanda:/tmp/head-schema.json
            rpk schema create "$subject" --schema /tmp/base-schema.json --type json > /dev/null
            rpk compatibility-level set "$subject" --level BACKWARD > /dev/null
            verdict=$(rpk schema check-compatibility "$subject" --schema /tmp/head-schema.json --type json --schema-version latest --format json)
            if echo "$verdict" | jq -e '.compatible == true' > /dev/null; then
              echo "$name: compatible"
            else
              echo "$name: NOT compatible"; echo "$verdict" | jq .; status=1
            fi
          done
          exit $status
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      # The one deployable's image (composition/mvp/Dockerfile), built with buildx and its layers
      # cached in the GitHub Actions cache, then loaded under the tag the compose profile mvp runs.
      - uses: docker/setup-buildx-action@v4
      - name: Build the deployable's image (buildx, GitHub Actions cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: composition/mvp/Dockerfile
          tags: compliancewatch-mvp:local
          load: true
          cache-from: type=gha,scope=mvp-image
          cache-to: type=gha,mode=max,scope=mvp-image
      # The release step a deploy runs, from the image, on the fresh database and broker: every
      # service's migrations as the database owner (cw-mvp migrate), then the topics of
      # composition/mvp/topics.toml (cw-mvp topics apply). make product-image runs it once more
      # before the app and the worker start, which proves it changes nothing the second time.
      - name: The release from the image (cw-mvp release)
        run: docker compose --profile mvp run --rm mvp-release
      - name: Tenant tables have forced row-level security (migration lint, catalog rules)
        run: make migrations-catalog
      # The services' own roles (infra/dev/postgres/roles.sql): the fresh volume got them before
      # the release migrated, and make db-roles runs the file again, as make migrate and make dev
      # do, which also takes back the writes on each alembic_version that the default privileges
      # gave. Twice, since it must change nothing the second time. No cw_ role may be a superuser,
      # bypass row-level security, write an alembic_version, create objects in public or its own
      # schema, or be a member of another role, and each of the ten logs in with nothing but LOGIN.
      - name: Service roles, none a superuser or bypassing row-level security (make db-roles)
        run: |
          make db-roles
          make db-roles
          sql() { docker compose exec -T postgres psql -U cw -d compliancewatch -v ON_ERROR_STOP=1 -Atc "$1"; }
          bypass=$(sql "select coalesce(string_agg(rolname, ', '), '') from pg_roles where rolname like 'cw\_%' and (rolsuper or rolbypassrls)")
          if [ -n "$bypass" ]; then
            echo "::error::these roles are superusers or bypass row-level security: $bypass"; exit 1
          fi
          sql "select rolname, rolsuper, rolbypassrls, rolinherit, rolcreatedb, rolcreaterole from pg_roles where rolname like 'cw\_%' order by 1"
          plain=$(sql "select count(*) from pg_roles where rolname in ('cw_identity', 'cw_profile', 'cw_rulebook', 'cw_applicability', 'cw_obligation', 'cw_notification', 'cw_qa', 'cw_llm_gateway', 'cw_eval', 'cw_pipeline') and rolcanlogin and not (rolinherit or rolcreatedb or rolcreaterole or rolreplication)")
          test "$plain" = 10
          writes=$(sql "select count(*) from pg_namespace n where case when to_regrole('cw_' || n.nspname) is null or to_regclass(format('%I.alembic_version', n.nspname)) is null then false else has_table_privilege('cw_' || n.nspname, format('%I.alembic_version', n.nspname), 'INSERT, UPDATE, DELETE, TRUNCATE') end")
          test "$writes" = 0
          creates=$(sql "select coalesce(string_agg(r.rolname || ' on ' || n.nspname, ', '), '') from pg_roles r join pg_namespace n on n.nspname in ('public', substr(r.rolname, 4)) where r.rolname like 'cw\_%' and has_schema_privilege(r.oid, n.oid, 'CREATE')")
          if [ -n "$creates" ]; then
            echo "::error::these roles may create objects in a schema: $creates"; exit 1
          fi
          members=$(sql "select coalesce(string_agg(m.rolname || ' in ' || g.rolname, ', '), '') from pg_auth_members a join pg_roles m on m.oid = a.member join pg_roles g on g.oid = a.roleid where m.rolname like 'cw\_%'")
          if [ -n "$members" ]; then
            echo "::error::these roles are members of other roles: $members"; exit 1
          fi
      # The catalog again, now that make db-roles has made the identity directory's read policy
      # (roles.sql): the lint accepts it only as roles.sql declares it.
      - name: Tenant tables after the roles (migration lint, catalog rules)
        run: make migrations-catalog
      # Each service started on its own as its own role: the UI-only stack on the Postgres store
      # (make web-stack STORE=postgres connects each service as cw_<schema>) answers /ready on
      # every port, and a tenant's read under row-level security answers 200; then it stops. On
      # any failure, make web-stack-wait's included, the services' logs are printed first.
      - name: Each service answers /ready as its own role (make web-stack STORE=postgres)
        run: |
          trap 'code=$?; if [ "$code" -ne 0 ]; then tail -n 40 var/web-stack/*.log || true; fi; make web-stack-down' EXIT
          make web-stack STORE=postgres
          make web-stack-wait
          status=0
          for port in $(seq 8001 8010); do
            if ! curl -sf "http://localhost:$port/ready"; then echo "::error::/ready failed on $port"; status=1; fi
            echo
          done
          tenant=00000000-0000-4000-8000-00000000c1a0
          curl -sf -H "x-tenant-id: $tenant" http://localhost:8002/v1/businesses | jq -e '.items == []' || status=1
          curl -sf -H "x-tenant-id: $tenant" http://localhost:8004/v1/applicability-engine/review-items | jq -e '.items == []' || status=1
          exit "$status"
      # The product from the image on this stack: the app and the worker in containers with Kafka
      # and Temporal on (compose profile mvp), the seed calendar from the image, synthetic tenants
      # and the demo publication, then the check, over HTTP on 8000 and 8080 and in the database
      # as cw_app, that a published rule becomes decisions, obligations with citations and a change
      # card through the sink. The database is fresh, so the check also runs its destructive
      # rollback step, which withdraws gstr9_annual and sees its obligations closed and the
      # withdrawal notices sent. make product, the local processes, stays the development path.
      - name: The product from the image (make product-image, make product-seed, make product-check)
        run: |
          make product-image MVP_BUILD=0
          make product-seed
          make product-check ARGS="--destructive"
      # The web app on that product: built (no CW_WEB_* variable, as in the typescript job) and
      # started with next start by Playwright against the internal listener (:8080), signed in as
      # the tenant make product-seed recorded, through the obligations, the calendar, an
      # obligation's page and its tracking, the changes feed and ask (Playwright project
      # product). It talks HTTP only, so the image costs it nothing over the local processes.
      # Chromium comes as the web-e2e job fetches it; nothing else is installed.
      - name: Workspace and Chromium for the product journey
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web e2e:install
      - name: The product journey in the web app (make product-e2e)
        run: make product-e2e
      - name: Product logs
        if: failure()
        run: |
          mkdir -p var/product
          for proc in release app worker; do
            make product-image-logs PROC="$proc" FOLLOW=0 > "var/product/$proc.log" 2>&1 || true
            tail -n 100 "var/product/$proc.log"
          done
          tail -n 50 var/product/sink.jsonl || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-product
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            var/product/*.log
            var/seed/last.json
          if-no-files-found: ignore
      - name: Stop the product
        if: always()
        run: make product-image-down
      - name: Observability profile starts and answers (collector, Prometheus, Tempo, Grafana)
        run: |
          docker compose --profile observability up -d --wait --wait-timeout 180 otel-collector prometheus tempo grafana
          curl -sf http://localhost:13133/ | jq -e '.status == "Server available"'
          curl -sf http://localhost:9090/-/ready
          curl -sf http://localhost:3030/api/health | jq -e '.database == "ok"'
          # Tempo answers its datasource health check only once its ingester has joined the ring,
          # which can take longer than the container's start; give it up to two minutes.
          for _ in $(seq 1 24); do
            if curl -sf http://localhost:3030/api/datasources/uid/tempo/health | jq -e '.status == "OK"'; then
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:3030/api/datasources/uid/tempo/health | jq -e '.status == "OK"'
          curl -sf http://localhost:3030/api/dashboards/uid/cw-services | jq -e '.dashboard.title == "ComplianceWatch services"'
      - name: Build and smoke the fake LLM gateway image
        run: |
          docker compose --profile llm up -d --build --wait --wait-timeout 180 fake-llm
          curl -sf http://localhost:8090/health
          curl -sf http://localhost:8090/ready
          curl -sf -X POST http://localhost:8090/v1/llm-gateway/completions \
            -H 'content-type: application/json' \
            -d '{"feature":"smoke","prompt":"smoke.echo@1","user":"ci smoke"}' > completion.json
          cat completion.json
          jq -e '.provider == "fake" and .cached == false' completion.json
          curl -sf -X POST http://localhost:8090/v1/llm-gateway/embeddings \
            -H 'content-type: application/json' \
            -d '{"feature":"retrieval","inputs":["ci smoke"]}' > embedding.json
          jq 'del(.vectors)' embedding.json
          jq -e '.dims == 512 and (.vectors[0] | length) == 512' embedding.json
      - name: Logs and teardown
        if: always()
        run: |
          docker compose --profile llm --profile observability --profile mvp logs --no-color | tail -200
          docker compose --profile llm --profile observability --profile mvp down -v --remove-orphans

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1" # keep in step with .pre-commit-config.yaml
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false" # PR comments need pull-requests: write; summary + SARIF suffice
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # required only once the repo moves under a GitHub organisation

  sast:
    name: SAST (semgrep registry packs and repository rules)
    needs: changes
    if: needs.changes.outputs.sast == 'true'
    runs-on: ubuntu-latest # Docker runs the pinned semgrep image, as make sast does locally
    permissions:
      contents: read
      actions: read # upload-sarif reads the workflow run; a private repository requires it
      security-events: write # findings go to code scanning
    steps:
      - uses: actions/checkout@v7
      # p/python, p/typescript, p/dockerfile and p/github-actions from the registry plus the rules
      # in .semgrep, with metrics off; a finding of severity ERROR fails. Then the rules' cases.
      - name: Semgrep scan and the repository rules' test cases
        run: make sast
      - name: Findings to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-scan:
    name: Dependency and config scan (trivy)
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # upload-sarif reads the workflow run; a private repository requires it
      security-events: write # findings go to code scanning
    steps:
      - uses: actions/checkout@v7
      # uv.lock, pnpm-lock.yaml and the Dockerfiles: HIGH and CRITICAL vulnerabilities that have a
      # fix, and misconfigurations. Settings in .trivy.yaml (the same file make deps-scan reads);
      # accepted findings in .trivyignore.yaml, each with a statement and an expiry date. The
      # action is pinned to the commit of its tag, since a tag can be moved.
      - name: Vulnerabilities and misconfigurations (fails on a finding)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          version: v0.74.0 # keep in step with TRIVY_IMAGE in the Makefile
          cache-dir: ${{ runner.temp }}/trivy # outside the checkout, so the scan never reads it
      - name: The same findings as SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          limit-severities-for-sarif: "true"
          skip-setup-trivy: "true"
          cache: "false" # the first step restored the database into cache-dir
          cache-dir: ${{ runner.temp }}/trivy
      - name: Findings to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

  web-e2e:
    name: Web e2e (Playwright with axe against next start and the services)
    needs: changes
    # The suite drives the services through the Makefile's web-stack and seeds them, so a change
    # to a service, the Python packages they share, the lock file or the Makefile (the python
    # filter) can break it as surely as a change to the app (the typescript filter).
    if: needs.changes.outputs.typescript == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The services the app talks to run from the uv workspace, as `make run` would start them.
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      # Generated files no other job compares: the screen list against the registry, and the
      # TypeScript types under packages/contracts/clients/typescript/openapi against the specs.
      - name: Generated screen list and OpenAPI types are current
        run: make web-screens-check openapi-ts-check
      # Every service on 8001-8010 (SERVICE_PORT_BASE 8000, the app's default URLs), started in
      # the background with memory stores and the fixed demo settings of the web stack (the
      # static GSTIN lookup, billing "none", KAG off, the rulebook publishing with the placeholder
      # tokens local-write-token and local-review-token and starting with the seed calendar's
      # drafts): no container. They start while the app builds.
      - name: Start the services (memory stores, no container)
        run: make web-stack
      # The playwright package has no install script (strictDepBuilds stays satisfied); the
      # browser and its system libraries are fetched here, explicitly. The browser download is
      # the slow part (one run reached the job's limit while still fetching it), so it is kept
      # in the cache under the Playwright version apps/web pins. A hit still installs the system
      # libraries, which the cache does not carry; a miss installs both, as before.
      - name: Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Chromium for Playwright
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm --filter web e2e:install
      - name: System libraries for the cached Chromium
        if: steps.playwright-browsers.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      # Built with no CW_WEB_* variable, like the typescript job: the pages read the
      # environment per request, never at build time.
      - name: Build the web app
        run: pnpm --filter web build
      - name: Wait for every service's /health
        run: make web-stack-wait WEB_STACK_WAIT_SECONDS=120
      # The demo tenant over the services' HTTP APIs (consents, the GSTIN registration with its
      # pre-fill and answers, the WhatsApp preference) and one recorded CBIC notification with
      # its clauses, mentions and relation candidate; exits non-zero on any failed step and
      # writes var/seed/last.json, which the sign-in form offers and the seeded-tenant spec uses.
      - name: Seed the demo tenant and the recorded notification
        run: make web-seed
      # playwright.config.ts starts `next start` on PORT with CW_WEB_ENV=test (the local-only
      # pages exist there), the fake sign-in provider and a fixed session secret, and waits for
      # /api/health. The suite visits every registered page, signs in through the form, and
      # fails a page on a serious or critical axe finding.
      - name: Playwright with axe against next start
        env:
          PORT: "3000"
          CW_WEB_ENV: test
        run: pnpm --filter web e2e --project=chromium
      - name: Service log tails
        if: always()
        run: make web-stack-logs
      - name: Stop the services
        if: always()
        run: make web-stack-down
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            var/web-stack/*.log
            var/seed/last.json
          if-no-files-found: ignore

  # The one check branch protection requires. A job that path filters skip counts as passed; any
  # other result, a failure or a cancellation, fails the gate. New jobs go above this one and into
  # its needs (make ci-gate-check fails otherwise).
  gate:
    name: CI gate
    needs:
      - changes
      - python
      - evals
      - typescript
      - contracts
      - integration
      - ops
      - dev-stack
      - gitleaks
      - sast
      - dependency-scan
      - web-e2e
    if: always() # a failed need would otherwise skip the gate, and a skipped check passes
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null

