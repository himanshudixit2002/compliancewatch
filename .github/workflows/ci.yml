# CI (guide section 17). Implemented: 1 lint + type-check, 2 unit tests with coverage gate,
# 3 contract checks (import-linter, the OpenAPI spec per service through its contract test, and
# the event schemas: metaschema, golden examples, generated clients in sync, backward compatibility
# against the base branch by example replay and by the Redpanda schema registry; migration lint is
# TODO), a compose dev-stack smoke, and secrets scanning. Steps 4-7 are listed as TODO at the end.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      devstack: ${{ steps.filter.outputs.devstack }}
      contracts: ${{ steps.filter.outputs.contracts }}
      schemas: ${{ steps.filter.outputs.schemas }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'services/**'
              - 'packages/domain-kernel/**'
              - 'packages/ontology/**'
              - 'packages/py-common/**'
              - 'packages/contracts/**'
              - 'evals/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'conftest.py'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            typescript:
              - 'apps/**'
              - 'packages/ui/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.prettierignore'
              - '.nvmrc'
              - '**/*.yml' # prettier --check . also covers YAML outside the packages
              - '**/*.yaml'
              - '.github/workflows/ci.yml'
            contracts:
              - 'packages/contracts/**'
              - 'packages/py-common/**'
              - 'packages/domain-kernel/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            schemas:
              - 'packages/contracts/events/schemas/**'
            devstack:
              - 'docker-compose.yml'
              - 'infra/dev/**'
              - '.env.example'
              - '.dockerignore'
              - 'Makefile'
              - 'services/*/migrations/**'
              - 'services/*/alembic.ini'
              - 'packages/contracts/events/schemas/**' # registry compatibility step
              # The fake-llm image is built from these (the llm-gateway Dockerfile copies them)
              - 'services/llm-gateway/**'
              - 'packages/py-common/**'
              - 'packages/domain-kernel/**'
              - 'packages/ontology/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'

  python:
    name: Python (ruff, mypy, import-linter, pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      # The same gates as `make check` locally (py- side): ruff, per-package mypy --strict (src, tests,
      # migrations/env.py), import-linter, pytest with the 80% coverage gate, uv lock check.
      - name: Lint and format check (ruff)
        run: make py-lint
      - name: Type-check (mypy --strict per package)
        run: make py-typecheck
      - name: Contract check - import boundaries (import-linter)
        run: make importlint
      # Section 17 step 3: the OpenAPI spec is covered per service by its contract test (pytest
      # step); the event schemas by the contracts job below. TODO: migration lint (tenant_id + RLS).
      - name: Unit tests with coverage gate (80% on domain and application layers, guide section 19)
        run: make py-test
      - name: Lockfile is current
        run: make lock-check

  typescript:
    name: TypeScript (eslint, tsc, vitest, build)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check (prettier)
        run: pnpm format
      - name: Lint, type-check, unit tests with coverage gate, build (Turborepo, per package)
        run: pnpm turbo run lint typecheck test build

  contracts:
    name: Event contracts (schemas, examples, generated clients, compatibility)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the compatibility check reads the base branch's schemas and examples
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: pnpm/action-setup@v6 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - name: Schemas pass the 2020-12 metaschema and the generated clients match them
        run: make contracts-check
      - name: Examples and generated models agree with the schemas
        run: uv run pytest packages/contracts -q
      - name: Backward compatible with the base branch (base examples replayed against these schemas)
        if: github.event_name == 'pull_request'
        run: uv run python packages/contracts/scripts/check_compat.py --base-ref "origin/${{ github.base_ref }}"

  dev-stack:
    name: Dev stack (docker compose smoke + migrations)
    needs: changes
    if: needs.changes.outputs.devstack == 'true'
    runs-on: ubuntu-latest # has docker + compose v2
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose --profile observability config -q
          docker compose --profile llm config -q
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Schemas, pgvector, Redpanda and Temporal are up
        run: |
          schemas=$(docker compose exec -T postgres psql -U cw -d compliancewatch -Atc "select string_agg(nspname, ',' order by nspname) from pg_namespace where nspname not like 'pg\_%' and nspname <> 'information_schema'")
          echo "schemas: $schemas"
          test "$schemas" = "applicability,audit,eval,identity,llm_gateway,notification,obligation,pipeline,profile,public,qa,rulebook"
          docker compose exec -T postgres psql -U cw -d compliancewatch -Atc "select extversion from pg_extension where extname = 'vector'" | grep -E '^[0-9]'
          docker compose exec -T redpanda rpk cluster health
          docker compose exec -T temporal temporal operator cluster health --address temporal:7233
      - name: Event schemas are backward compatible in the Redpanda schema registry
        # The base branch's version of each schema is registered under <topic>-value with
        # BACKWARD compatibility, then the PR's version is checked against it. rpk exits 0 either
        # way, so the JSON verdict decides.
        if: github.event_name == 'pull_request' && needs.changes.outputs.schemas == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          rpk() { docker compose exec -T redpanda rpk registry -X registry.hosts=localhost:8081 "$@"; }
          status=0
          for schema in packages/contracts/events/schemas/*.json; do
            name=$(basename "$schema" .json)
            topic=${name%.v*}
            subject="${topic}-value"
            if ! git cat-file -e "origin/$BASE_REF:$schema" 2>/dev/null; then
              echo "$name: new on this branch, nothing to compare"; continue
            fi
            git show "origin/$BASE_REF:$schema" > /tmp/base-schema.json
            docker compose cp /tmp/base-schema.json redpanda:/tmp/base-schema.json
            docker compose cp "$schema" redpanda:/tmp/head-schema.json
            rpk schema create "$subject" --schema /tmp/base-schema.json --type json > /dev/null
            rpk compatibility-level set "$subject" --level BACKWARD > /dev/null
            verdict=$(rpk schema check-compatibility "$subject" --schema /tmp/head-schema.json --type json --schema-version latest --format json)
            if echo "$verdict" | jq -e '.compatible == true' > /dev/null; then
              echo "$name: compatible"
            else
              echo "$name: NOT compatible"; echo "$verdict" | jq .; status=1
            fi
          done
          exit $status
      - uses: astral-sh/setup-uv@v10.2.0 # exact tag: astral publishes no floating v10 tag
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Run every service's migrations against the stack
        run: |
          uv sync --all-packages --locked
          make migrate
      - name: Observability profile starts and answers (collector, Prometheus, Tempo, Grafana)
        run: |
          docker compose --profile observability up -d --wait --wait-timeout 180 otel-collector prometheus tempo grafana
          curl -sf http://localhost:13133/ | jq -e '.status == "Server available"'
          curl -sf http://localhost:9090/-/ready
          curl -sf http://localhost:3030/api/health | jq -e '.database == "ok"'
          curl -sf http://localhost:3030/api/datasources/uid/tempo/health | jq -e '.status == "OK"'
          curl -sf http://localhost:3030/api/dashboards/uid/cw-services | jq -e '.dashboard.title == "ComplianceWatch services"'
      - name: Build and smoke the fake LLM gateway image
        run: |
          docker compose --profile llm up -d --build --wait --wait-timeout 180 fake-llm
          curl -sf http://localhost:8090/health
          curl -sf http://localhost:8090/ready
          curl -sf -X POST http://localhost:8090/v1/llm-gateway/completions \
            -H 'content-type: application/json' \
            -d '{"feature":"smoke","prompt":"smoke.echo@1","user":"ci smoke"}' > completion.json
          cat completion.json
          jq -e '.provider == "fake" and .cached == false' completion.json
      - name: Logs and teardown
        if: always()
        run: |
          docker compose --profile llm --profile observability logs --no-color | tail -200
          docker compose --profile llm --profile observability down -v --remove-orphans

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1" # keep in step with .pre-commit-config.yaml
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false" # PR comments need pull-requests: write; summary + SARIF suffice
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # required only once the repo moves under a GitHub organisation

# -----------------------------------------------------------------------------------------------
# TODO (guide section 17, steps 4-7) - not implemented yet:
#   4. integration: testcontainers (Postgres, Redpanda, Temporal test server) for affected services,
#                   e.g. `uv run pytest -m integration` (Docker is available on ubuntu-latest)
#   5. evals:       run evals/harness when paths change under services/pipeline/prompts/**, services/qa/**,
#                   services/applicability-engine/** or evals/**; section 8 thresholds block the merge
#   6. images:      per-service image build, SBOM (syft), Trivy scan, cosign sign, push to ECR
#   7. deploy:      Argo CD sync to staging, Playwright e2e and k6 smoke against staging
# -----------------------------------------------------------------------------------------------
