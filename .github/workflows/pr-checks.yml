# Pull-request hygiene (guide section 13: conventional commits + squash merge; section 14: CODEOWNERS).
# Separate from ci.yml so that editing a PR title reruns only these cheap checks.
name: pr-checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional Commit PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same list as the conventional-pre-commit hook in .pre-commit-config.yaml
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            build
            perf
            revert
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter (it becomes the squash commit).

  codeowners:
    name: CODEOWNERS resolves
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub to parse CODEOWNERS at the PR head (syntax errors, unknown owners)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${REF}" > codeowners-errors.json
          cat codeowners-errors.json
          test "$(jq '.errors | length' codeowners-errors.json)" -eq 0
