[project]
name = "py-common"
version = "0.1.0"
description = "ComplianceWatch shared runtime: settings, structured logging, health endpoints, FastAPI app factory, problem details, event envelope and transactional outbox"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "structlog>=25.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "aiokafka>=0.14,<0.15",
  "domain-kernel",
]

[tool.uv.sources]
domain-kernel = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_common"]
