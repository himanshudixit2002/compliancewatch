[project]
name = "py-common"
version = "0.1.0"
description = "ComplianceWatch shared runtime: settings, structured logging, health endpoints, FastAPI app factory, problem details, event envelope and transactional outbox, Temporal worker scaffold, OpenTelemetry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-dotenv>=1.0",  # py_common.flags reads .env the way the settings do
  "structlog>=25.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "aiokafka>=0.14,<0.15",
  "temporalio[opentelemetry,pydantic]>=1.34,<1.35",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",  # CW_OTEL_PROTOCOL=http/protobuf
  "opentelemetry-instrumentation-fastapi==0.66b0",
  "opentelemetry-instrumentation-sqlalchemy==0.66b0",
  "openfeature-sdk==0.10.0",
  "pyjwt[crypto]>=2.10",  # py_common.auth: ES256 access tokens and JWKS
  "httpx2>=2.13",  # py_common.auth: JWKS fetches and service tokens from identity
  "domain-kernel",
]

[project.optional-dependencies]
# The Unleash flag provider (CW_FLAGS_PROVIDER=unleash); py_common.flags imports it only then.
unleash = ["UnleashClient==6.8.0"]

[tool.uv.sources]
domain-kernel = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_common"]
