[project]
name = "compliancewatch-contracts"
version = "0.1.0"
description = "ComplianceWatch contracts as pydantic v2 models, generated by `make contracts`: the events (packages/contracts/events) and the public REST API (packages/contracts/openapi)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cw_contracts"]
