# Fly.io app for the qa service (MVP profile; the EKS path of the guide comes later).
# Create once by hand: fly apps create compliancewatch-qa --org <org>; secrets: fly secrets set CW_DATABASE_URL=... (see infra/deploy/README.md).
app = "compliancewatch-qa"
primary_region = "bom"

[build]
  dockerfile = "services/qa/Dockerfile"
  # build context is the repo root: fly deploy --config infra/deploy/fly/qa.toml .

[env]
  CW_ENV = "staging"
  CW_LOG_JSON = "true"
  CW_DB_SCHEMA = "qa"
  CW_OTEL_ENDPOINT = ""
  # KAG planner and solver (ADR-017): owner ai-platform; removed when ADR-017 is Accepted.
  # CW_QA_KAG_TENANTS is a comma list of tenant UUIDs; empty means every tenant.
  CW_QA_KAG_ENABLED = "false"
  CW_QA_KAG_TENANTS = ""
  CW_RULEBOOK_URL = "http://compliancewatch-rulebook.internal:8000"
  CW_PROFILE_URL = "http://compliancewatch-profile.internal:8000"
  CW_OBLIGATION_URL = "http://compliancewatch-obligation.internal:8000"
  CW_LLM_GATEWAY_URL = "http://compliancewatch-llm-gateway.internal:8000"

[deploy]
  # release_command = "alembic -c alembic.ini upgrade head"  # once the service has a migration

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
