# Fly.io app for the profile service (MVP profile; the EKS path of the guide comes later).
# Create once by hand: fly apps create compliancewatch-profile --org <org>; secrets: fly secrets set CW_DATABASE_URL=... (see infra/deploy/README.md).
app = "compliancewatch-profile"
primary_region = "bom"

[build]
  dockerfile = "services/profile/Dockerfile"
  # build context is the repo root: fly deploy --config infra/deploy/fly/profile.toml .

[env]
  CW_ENV = "staging"
  CW_LOG_JSON = "true"
  CW_DB_SCHEMA = "profile"
  CW_OTEL_ENDPOINT = ""

[deploy]
  release_command = "alembic -c alembic.ini upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
