# promtool unit tests for alerts.yml (`make alerts-check`, the ops job in ci.yml). The api-slo,
# workers, outbox, rulebook-review, notification and pipeline groups have cases; each package
# appends the cases for the alert group it owns.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # 5xx share: identity 3 in 1000 (0.3%), profile 1 in 1000 (0.1%); the threshold is 0.2%.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="identity", http_response_status_code="200"}'
        values: "0+997x40"
      - series: 'http_server_request_duration_seconds_count{service_name="identity", http_response_status_code="503"}'
        values: "0+3x40"
      - series: 'http_server_request_duration_seconds_count{service_name="profile", http_response_status_code="200"}'
        values: "0+999x40"
      - series: 'http_server_request_duration_seconds_count{service_name="profile", http_response_status_code="500"}'
        values: "0+1x40"
    alert_rule_test:
      # Above the threshold but not yet for 15 minutes: pending, not firing.
      - eval_time: 10m
        alertname: ApiErrorBurnRate
        exp_alerts: []
      - eval_time: 20m
        alertname: ApiErrorBurnRate
        exp_alerts:
          - exp_labels:
              service_name: identity
              severity: page
              team: platform
            exp_annotations:
              summary: "identity burns its availability SLO (5xx share above 0.2% over 1h; 2x the 99.9% budget)"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/api-slo-burn.md

  # p95 latency: identity 0.8 s (190th of 200 per minute falls 60% into the 0.5-1 s bucket),
  # profile 0.475 s (all 200 in the first bucket); the threshold is 0.6 s.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{service_name="identity", le="0.5"}'
        values: "0+175x40"
      - series: 'http_server_request_duration_seconds_bucket{service_name="identity", le="1"}'
        values: "0+200x40"
      - series: 'http_server_request_duration_seconds_bucket{service_name="identity", le="+Inf"}'
        values: "0+200x40"
      - series: 'http_server_request_duration_seconds_bucket{service_name="profile", le="0.5"}'
        values: "0+200x40"
      - series: 'http_server_request_duration_seconds_bucket{service_name="profile", le="1"}'
        values: "0+200x40"
      - series: 'http_server_request_duration_seconds_bucket{service_name="profile", le="+Inf"}'
        values: "0+200x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiLatencyBurnRate
        exp_alerts: []
      - eval_time: 20m
        alertname: ApiLatencyBurnRate
        exp_alerts:
          - exp_labels:
              service_name: identity
              severity: page
              team: platform
            exp_annotations:
              summary: "identity p95 read latency above 600 ms over 1h (2x the 300 ms objective)"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/api-slo-burn.md

  # TemporalWorkerDown. The pipeline queue reports until 30m and then stops (a stale marker, as
  # when the collector expires the series); the rulebook queue keeps reporting. Down from 31m,
  # so pending until it fires at 41m, 10 minutes after the queue stopped reporting.
  - interval: 1m
    input_series:
      - series: 'temporal_worker_up{task_queue="pipeline", service_name="pipeline-worker", service_instance_id="a"}'
        values: "1x30 stale"
      - series: 'temporal_worker_up{task_queue="rulebook", service_name="rulebook-worker", service_instance_id="b"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: TemporalWorkerDown
        exp_alerts: []
      - eval_time: 40m
        alertname: TemporalWorkerDown
        exp_alerts: []
      - eval_time: 41m
        alertname: TemporalWorkerDown
        exp_alerts:
          - exp_labels:
              task_queue: pipeline
              severity: ticket
              team: regulatory-intelligence
            exp_annotations:
              summary: "No worker serves the Temporal task queue pipeline: it reported in the last 6 hours and has stopped"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/temporal-worker.md#temporalworkerdown

  # TemporalWorkerDown stays quiet across a restart: the old process's series stops at 20m and
  # the new process (another service_instance_id) reports from 22m on the same queue.
  - interval: 1m
    input_series:
      - series: 'temporal_worker_up{task_queue="pipeline", service_name="pipeline-worker", service_instance_id="a"}'
        values: "1x20 stale"
      - series: 'temporal_worker_up{task_queue="pipeline", service_name="pipeline-worker", service_instance_id="c"}'
        values: "_x22 1x40"
    alert_rule_test:
      - eval_time: 21m
        alertname: TemporalWorkerDown
        exp_alerts: []
      - eval_time: 60m
        alertname: TemporalWorkerDown
        exp_alerts: []

  # TelemetrySilent: no span counter at all from the start fires after 30 minutes.
  - interval: 1m
    input_series:
      - series: 'up{job="otel-collector"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: TelemetrySilent
        exp_alerts: []
      - eval_time: 31m
        alertname: TelemetrySilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: platform
            exp_annotations:
              summary: "No spans have reached the collector for 30 minutes: exporters or the collector are down"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/temporal-worker.md#telemetrysilent

  # TelemetrySilent stays quiet while spans arrive.
  - interval: 1m
    input_series:
      - series: 'otelcol_receiver_accepted_spans_total{receiver="otlp", transport="grpc"}'
        values: "0+10x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: TelemetrySilent
        exp_alerts: []

  # Pending outbox rows: obligation holds 1200 (above 1000), profile 10. The rule needs 15 minutes.
  - interval: 1m
    input_series:
      - series: 'outbox_relay_pending{db_schema="obligation"}'
        values: '1200x30'
      - series: 'outbox_relay_pending{db_schema="profile"}'
        values: '10x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxBacklog
        exp_alerts: []
      - eval_time: 20m
        alertname: OutboxBacklog
        exp_alerts:
          - exp_labels:
              db_schema: obligation
              severity: page
              team: platform
            exp_annotations:
              summary: "More than 1000 unpublished outbox rows for 15 minutes in schema obligation"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/outbox-relay.md

  # The oldest open review item is 50 hours old and ageing; the rule needs 1 hour above 48 hours.
  - interval: 1m
    input_series:
      - series: 'rulebook_entity_review_oldest_open_age_seconds{instance="rulebook-1"}'
        values: '180000+60x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: EntityReviewQueueStale
        exp_alerts: []
      - eval_time: 90m
        alertname: EntityReviewQueueStale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: regulatory-intelligence
            exp_annotations:
              summary: "The oldest open entity review item has waited more than 48 hours"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/entity-review-queue.md

  # Two rulebook replicas report the same 300 open forms, which count once, plus 250 sections:
  # 550 open items, above 500. The rule needs 6 hours.
  - interval: 1m
    input_series:
      - series: 'rulebook_entity_review_open_items{entity_type="form", instance="rulebook-1"}'
        values: '300x480'
      - series: 'rulebook_entity_review_open_items{entity_type="form", instance="rulebook-2"}'
        values: '300x480'
      - series: 'rulebook_entity_review_open_items{entity_type="section", instance="rulebook-1"}'
        values: '250x480'
    alert_rule_test:
      - eval_time: 5h
        alertname: EntityReviewQueueBacklog
        exp_alerts: []
      - eval_time: 7h
        alertname: EntityReviewQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: regulatory-intelligence
            exp_annotations:
              summary: "More than 500 entity review items have been open for 6 hours"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/entity-review-queue.md

  # 450 open items (a form count reported by two replicas counts once): no alert.
  - interval: 1m
    input_series:
      - series: 'rulebook_entity_review_open_items{entity_type="form", instance="rulebook-1"}'
        values: '300x480'
      - series: 'rulebook_entity_review_open_items{entity_type="form", instance="rulebook-2"}'
        values: '300x480'
      - series: 'rulebook_entity_review_open_items{entity_type="section", instance="rulebook-1"}'
        values: '150x480'
    alert_rule_test:
      - eval_time: 7h
        alertname: EntityReviewQueueBacklog
        exp_alerts: []

  # RuleReviewQueueStale. Two replicas report the same oldest waiting task, 47 hours old at the
  # start and a minute older every minute: above 48 hours from 61m, so pending for an hour and
  # firing from 121m, once.
  - interval: 1m
    input_series:
      - series: 'rulebook_review_task_oldest_open_age_seconds{service_instance_id="a"}'
        values: "169200+60x180"
      - series: 'rulebook_review_task_oldest_open_age_seconds{service_instance_id="b"}'
        values: "169200+60x180"
    alert_rule_test:
      - eval_time: 60m
        alertname: RuleReviewQueueStale
        exp_alerts: []
      - eval_time: 120m
        alertname: RuleReviewQueueStale
        exp_alerts: []
      - eval_time: 122m
        alertname: RuleReviewQueueStale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: regulatory-intelligence
            exp_annotations:
              summary: "The oldest rule review task has waited more than 48 hours for a decision"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/rule-review-queue.md

  # The queue is worked: the oldest task is 47 hours old and decided at 30m, after which the next
  # one is 2 hours old. No alert.
  - interval: 1m
    input_series:
      - series: 'rulebook_review_task_oldest_open_age_seconds{service_instance_id="a"}'
        values: "169200+60x30 7200+60x150"
    alert_rule_test:
      - eval_time: 180m
        alertname: RuleReviewQueueStale
        exp_alerts: []

  # WhatsApp: 3 of 100 finished notifications failed for good each minute (3%), with retries on
  # top that do not count. Email: 1 in 200 (0.5%). The rule needs 15 minutes above 1%.
  - interval: 1m
    input_series:
      - series: 'notification_sends_total{channel="whatsapp", outcome="sent"}'
        values: "0+97x60"
      - series: 'notification_sends_total{channel="whatsapp", outcome="failed"}'
        values: "0+3x60"
      - series: 'notification_sends_total{channel="whatsapp", outcome="retry"}'
        values: "0+50x60"
      - series: 'notification_sends_total{channel="email", outcome="sent"}'
        values: "0+199x60"
      - series: 'notification_sends_total{channel="email", outcome="failed"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: NotificationDeliveryFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: NotificationDeliveryFailures
        exp_alerts:
          - exp_labels:
              channel: whatsapp
              severity: page
              team: core-product
            exp_annotations:
              summary: "More than 1% of whatsapp notifications failed for good over 15 minutes"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationdeliveryfailures

  # One duplicate delivery on WhatsApp at minute 10 fires at once and clears once it is 15
  # minutes old.
  - interval: 1m
    input_series:
      - series: 'notification_duplicate_sent_total{channel="whatsapp"}'
        values: "0x10 1x30"
      - series: 'notification_duplicate_sent_total{channel="email"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: NotificationDuplicateSent
        exp_alerts: []
      - eval_time: 12m
        alertname: NotificationDuplicateSent
        exp_alerts:
          - exp_labels:
              channel: whatsapp
              severity: page
              team: core-product
            exp_annotations:
              summary: "A notification was delivered twice on whatsapp"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationduplicatesent
      - eval_time: 35m
        alertname: NotificationDuplicateSent
        exp_alerts: []

  # Two API replicas report the pending age. On one the rulebook outage ages it by a minute each
  # minute from 0; the other read before and still says 0. max() takes the older: above 900 s
  # from 16m, so pending until it fires at 21m.
  - interval: 1m
    input_series:
      - series: 'notification_pending_oldest_age_seconds{service_instance_id="a"}'
        values: "0+60x40"
      - series: 'notification_pending_oldest_age_seconds{service_instance_id="b"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: NotificationPendingOverdue
        exp_alerts: []
      - eval_time: 20m
        alertname: NotificationPendingOverdue
        exp_alerts: []
      - eval_time: 21m
        alertname: NotificationPendingOverdue
        exp_alerts:
          - exp_labels:
              severity: page
              team: core-product
            exp_annotations:
              summary: "A pending notification has waited more than 15 minutes past its planned time"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationpendingoverdue

  # An old notification that went out within 3 minutes of passing the objective does not page.
  - interval: 1m
    input_series:
      - series: 'notification_pending_oldest_age_seconds{service_instance_id="a"}'
        values: "0x10 1000 1060 1120 0x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: NotificationPendingOverdue
        exp_alerts: []
      - eval_time: 30m
        alertname: NotificationPendingOverdue
        exp_alerts: []

  # 100 emails sent a minute, 3 of them bounce (3%): above 2% from the start, firing after 30
  # minutes. The complaints stay at zero, and WhatsApp receipts do not count.
  - interval: 1m
    input_series:
      - series: 'notification_sends_total{channel="email", outcome="sent"}'
        values: "0+100x60"
      - series: 'notification_receipts_total{channel="email", kind="bounced", outcome="applied"}'
        values: "0+3x60"
      - series: 'notification_receipts_total{channel="email", kind="complained", outcome="applied"}'
        values: "0x60"
      - series: 'notification_receipts_total{channel="whatsapp", kind="failed", outcome="applied"}'
        values: "0+50x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: NotificationEmailBounces
        exp_alerts: []
      - eval_time: 40m
        alertname: NotificationEmailBounces
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: core-product
            exp_annotations:
              summary: "Email bounces and complaints passed 2% of the email notifications sent over 6 hours"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationemailbounces

  # 1 bounce in 100 (1%) stays below the threshold.
  - interval: 1m
    input_series:
      - series: 'notification_sends_total{channel="email", outcome="sent"}'
        values: "0+100x60"
      - series: 'notification_receipts_total{channel="email", kind="bounced", outcome="unknown"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: NotificationEmailBounces
        exp_alerts: []

  # SourceStale. cbic_notifications (a 2-hour cadence) is not listed again: its freshness grows a
  # minute every minute, passes two cadences (14,400 s) after 240 minutes and pages 5 minutes
  # later. gstn_advisories (3 hours) is listed every 10 minutes and stays fresh. Two replicas of
  # the app report the same reading of cbic_notifications.
  - interval: 1m
    input_series:
      - series: 'pipeline_source_freshness_seconds{source="cbic_notifications", service_instance_id="a"}'
        values: "0+60x300"
      - series: 'pipeline_source_freshness_seconds{source="cbic_notifications", service_instance_id="b"}'
        values: "0+60x300"
      - series: 'pipeline_source_cadence_seconds{source="cbic_notifications", service_instance_id="a"}'
        values: "7200x300"
      - series: 'pipeline_source_cadence_seconds{source="cbic_notifications", service_instance_id="b"}'
        values: "7200x300"
      - series: 'pipeline_source_freshness_seconds{source="gstn_advisories", service_instance_id="a"}'
        values: "0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x9"
      - series: 'pipeline_source_cadence_seconds{source="gstn_advisories", service_instance_id="a"}'
        values: "10800x300"
    alert_rule_test:
      # Two cadences exactly: not stale yet.
      - eval_time: 240m
        alertname: SourceStale
        exp_alerts: []
      # Stale since 241m: pending, not firing, for 5 minutes.
      - eval_time: 244m
        alertname: SourceStale
        exp_alerts: []
      - eval_time: 250m
        alertname: SourceStale
        exp_alerts:
          - exp_labels:
              source: cbic_notifications
              severity: page
              team: regulatory-intelligence
            exp_annotations:
              summary: "No crawl has listed cbic_notifications for more than two cadences"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/source-stale.md

  # ParseFailureQueueHigh. Two replicas report the same count of open manual parses: 15 for the
  # first 20 minutes (normal work), then 25 from 20m. Above 20 from 20m, so pending for 30
  # minutes and firing at 50m, once. Open triage tasks above 20 never fire it.
  - interval: 1m
    input_series:
      - series: 'pipeline_open_tasks{kind="manual_parse", service_instance_id="a"}'
        values: "15x19 25x60"
      - series: 'pipeline_open_tasks{kind="manual_parse", service_instance_id="b"}'
        values: "15x19 25x60"
      - series: 'pipeline_open_tasks{kind="triage", service_instance_id="a"}'
        values: "40x80"
    alert_rule_test:
      - eval_time: 19m
        alertname: ParseFailureQueueHigh
        exp_alerts: []
      - eval_time: 49m
        alertname: ParseFailureQueueHigh
        exp_alerts: []
      - eval_time: 50m
        alertname: ParseFailureQueueHigh
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: regulatory-intelligence
            exp_annotations:
              summary: "More than 20 documents no parser reads have waited 30 minutes for a manual parse"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/parse-failures.md

  # ParseFailureQueueHigh resolves once analysts work the queue down: 25 open for 40 minutes,
  # then 12; nothing fires after the count falls.
  - interval: 1m
    input_series:
      - series: 'pipeline_open_tasks{kind="manual_parse", service_instance_id="a"}'
        values: "25x40 12x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ParseFailureQueueHigh
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: regulatory-intelligence
            exp_annotations:
              summary: "More than 20 documents no parser reads have waited 30 minutes for a manual parse"
              runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/parse-failures.md
      - eval_time: 45m
        alertname: ParseFailureQueueHigh
        exp_alerts: []
