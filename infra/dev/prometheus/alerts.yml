# Paging alerts (guide section 18, architecture reference 8.3) that the current metrics can
# express. Every rule links its runbook; infra/scripts/check_alert_runbooks.py fails CI when a
# link is missing or points at a file that does not exist. promtool checks the rules and runs the
# unit tests in alerts.test.yml (`make alerts-check`, the ops job in ci.yml), so a change to a
# tested rule changes its cases there too. The remaining paging alerts of the guide (source
# freshness, decision-flip rate, LLM spend past 80% of budget) arrive with the metrics that feed
# them; docs/runbooks/README.md lists them as pending.
groups:
  - name: api-slo
    rules:
      - alert: ApiErrorBurnRate
        expr: |
          sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1h]))
            /
          sum by (service_name) (rate(http_server_request_duration_seconds_count[1h])) > 0.002
        for: 15m
        labels:
          severity: page
          team: platform
        annotations:
          summary: "{{ $labels.service_name }} burns its availability SLO (5xx share above 0.2% over 1h; 2x the 99.9% budget)"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/api-slo-burn.md
      - alert: ApiLatencyBurnRate
        expr: |
          histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket[1h]))) > 0.6
        for: 15m
        labels:
          severity: page
          team: platform
        annotations:
          summary: "{{ $labels.service_name }} p95 read latency above 600 ms over 1h (2x the 300 ms objective)"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/api-slo-burn.md
  - name: outbox
    rules:
      - alert: OutboxDeadLetters
        expr: sum by (topic) (increase(outbox_relay_dead_total[30m])) > 0
        for: 30m
        labels:
          severity: page
          team: platform
        annotations:
          summary: "Dead-letter depth above zero for 30 minutes on {{ $labels.topic }}"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/outbox-relay.md
      - alert: OutboxBacklog
        expr: max by (db_schema) (outbox_relay_pending) > 1000
        for: 15m
        labels:
          severity: page
          team: platform
        annotations:
          summary: "More than 1000 unpublished outbox rows for 15 minutes in schema {{ $labels.db_schema }}"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/outbox-relay.md
  - name: workers
    rules:
      # temporal_worker_up{task_queue} is 1 while a worker serves the queue (py_common.temporal
      # liveness) and the series ends when it stops. A queue seen in the last 6 hours that no
      # longer reports has lost every worker; the collector expires a stopped series after 5
      # minutes, so the alert fires about 15 minutes after the last worker went away. Restarts
      # change the per-process labels, so both sides are taken per task_queue only.
      - alert: TemporalWorkerDown
        expr: |
          max by (task_queue) (max_over_time(temporal_worker_up[6h]))
            unless on (task_queue)
          max by (task_queue) (temporal_worker_up)
        for: 10m
        labels:
          severity: ticket
          team: regulatory-intelligence
        annotations:
          summary: "No worker serves the Temporal task queue {{ $labels.task_queue }}: it reported in the last 6 hours and has stopped"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/temporal-worker.md#temporalworkerdown
      # Says only that the collector receives no spans: every service and worker has stopped
      # exporting, or the collector itself is down. It is not a worker alert.
      - alert: TelemetrySilent
        expr: absent(otelcol_receiver_accepted_spans_total) == 1
        for: 30m
        labels:
          severity: ticket
          team: platform
        annotations:
          summary: "No spans have reached the collector for 30 minutes: exporters or the collector are down"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/temporal-worker.md#telemetrysilent
  - name: rulebook-review
    rules:
      - alert: EntityReviewQueueStale
        expr: max(rulebook_entity_review_oldest_open_age_seconds) > 172800
        for: 1h
        labels:
          severity: ticket
          team: regulatory-intelligence
        annotations:
          summary: "The oldest open entity review item has waited more than 48 hours"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/entity-review-queue.md
      - alert: EntityReviewQueueBacklog
        expr: sum(max by (entity_type) (rulebook_entity_review_open_items)) > 500
        for: 6h
        labels:
          severity: ticket
          team: regulatory-intelligence
        annotations:
          summary: "More than 500 entity review items have been open for 6 hours"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/entity-review-queue.md
  - name: notification
    rules:
      # notification_sends_total counts every delivery attempt by outcome. The share is the
      # notifications whose last attempt failed against those sent plus those; a retry may still
      # succeed and a suppressed notification was never to go, so neither counts.
      - alert: NotificationDeliveryFailures
        expr: |
          sum by (channel) (rate(notification_sends_total{outcome="failed"}[15m]))
            /
          sum by (channel) (rate(notification_sends_total{outcome=~"sent|failed"}[15m])) > 0.01
        for: 15m
        labels:
          severity: page
          team: core-product
        annotations:
          summary: "More than 1% of {{ $labels.channel }} notifications failed for good over 15 minutes"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationdeliveryfailures
      # A delivery of a notification that was already sent should never happen: any increase.
      - alert: NotificationDuplicateSent
        expr: sum by (channel) (increase(notification_duplicate_sent_total[15m])) > 0
        labels:
          severity: page
          team: core-product
        annotations:
          summary: "A notification was delivered twice on {{ $labels.channel }}"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationduplicatesent
      # notification_pending_oldest_age_seconds is how long the pending notification that has
      # waited longest is past the moment it was planned to go out. The batching window, the
      # digest time and quiet hours set that moment; retries and rulebook outages do not move
      # it. Past the 15-minute delivery objective for 5 minutes: no dispatcher is sending, or
      # the rulebook has not answered for that long. Every API replica reports the same queue.
      - alert: NotificationPendingOverdue
        expr: max(notification_pending_oldest_age_seconds) > 900
        for: 5m
        labels:
          severity: page
          team: core-product
        annotations:
          summary: "A pending notification has waited more than 15 minutes past its planned time"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationpendingoverdue
      # SES puts a sending account under review when its bounces pass 5% or its complaints 0.1%
      # of its mail. Bounces and complaints reported against email notifications sent, over 6
      # hours, warn well before that: above 2% for 30 minutes.
      - alert: NotificationEmailBounces
        expr: |
          sum(increase(notification_receipts_total{channel="email", kind=~"bounced|complained"}[6h]))
            /
          sum(increase(notification_sends_total{channel="email", outcome="sent"}[6h])) > 0.02
        for: 30m
        labels:
          severity: ticket
          team: core-product
        annotations:
          summary: "Email bounces and complaints passed 2% of the email notifications sent over 6 hours"
          runbook_url: https://github.com/himanshudixit2002/compliancewatch/blob/main/docs/runbooks/notification-delivery.md#notificationemailbounces
