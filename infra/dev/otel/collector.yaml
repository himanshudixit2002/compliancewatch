# OpenTelemetry Collector for the dev stack (compose profile: observability).
# Services export OTLP over gRPC to localhost:4317 (CW_OTEL_ENDPOINT). Traces go to Tempo,
# metrics are exposed for Prometheus to scrape on 8889. Logs stay on stdout (structlog JSON);
# no log pipeline is configured.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # service.name and the other resource attributes become labels, so one dashboard can
    # split every metric by service.
    resource_constant_labels:
      included: ["*"]
    metric_expiration: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      # The collector's own metrics, scraped by Prometheus (job otel-collector-internal).
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
