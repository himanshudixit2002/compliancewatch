# Migration lint, catalog mode (infra/scripts/check_migrations.py, `make migrations-catalog`).
#
# Rules, checked after every service has migrated:
#   R1  a NOT NULL tenant_id means row-level security enabled and forced, and a policy for ALL
#       commands whose USING and WITH CHECK compare tenant_id with
#       NULLIF(current_setting('app.tenant_id', true), ''); the only other permissive policy
#       allowed is a purge policy, FOR DELETE USING (expires_at < now()) (idempotency keys);
#   R2  every table in a tenant schema has tenant_id;
#   R3  a nullable tenant_id only on an exempt table;
#   R4  every exemption below matches at least one table.
# A table in a schema listed in neither group fails too.
#
# Exemptions are append-only and land in the same pull request as the migration that needs
# them, each with the reason the report prints. `table` is schema.table and may use * for any
# schema. `kind` is "exempt" (the default: R1 to R3 are skipped) or "routing_directory" (reads
# may cross tenants, but every policy that admits a write must hold the tenant check).

[schemas]
# Customer data: every table carries tenant_id under row-level security.
tenant = ["identity", "profile", "obligation", "notification", "applicability", "qa"]
# Regulatory and platform data shared by every tenant. R1 and R3 still apply to any table here
# that has a tenant_id column.
global = ["rulebook", "pipeline", "llm_gateway", "eval", "audit"]

[[exemptions]]
table = "*.outbox_event"
reason = """
The outbox relay reads pending rows across tenants, and tenant_id is null for regulatory events
(py_common.outbox).
"""

[[exemptions]]
table = "*.processed_event"
reason = """
Consumer inbox keyed by consumer group and event id: it records which events were handled and
holds no tenant data (py_common.outbox).
"""

[[exemptions]]
table = "*.alembic_version"
reason = "Alembic's version table: one row naming the schema's migration head."

[[exemptions]]
table = "llm_gateway.cost_ledger"
reason = """
Row-level security is deliberately not applied: the cost dashboard reads this table across
tenants and tenant_id is NULL for regulatory calls (migration 0001 of llm-gateway).
"""

[[exemptions]]
table = "identity.channel_consent"
reason = """
Keyword opt-ins and opt-outs keyed by phone number, recorded when a person writes to the WhatsApp
number before any tenant owns it, so there is no tenant_id to isolate by. Only identity's
service-token routes read or write it, and a trigger keeps it append-only (migration 0002 of
identity).
"""

[[exemptions]]
table = "identity.tenant"
reason = """
The tenant table is the tenant itself, so it has no tenant_id: row-level security is enabled and
forced with a policy on id, which admits the tenant the app.tenant_id setting names and no other
(migration 0003 of identity).
"""

[[exemptions]]
table = "identity.user_subject"
reason = """
Which user, in which tenant, an identity provider's subject signs in as. The session exchange reads
it before it knows the tenant, so no tenant setting can apply; it holds ids only (migration 0003 of
identity).
"""

[[exemptions]]
table = "identity.service_client"
reason = """
Service clients belong to no tenant, so there is no tenant_id. It holds client ids, the SHA-256 of
each secret and the scopes, never a secret (migration 0003 of identity).
"""

[[exemptions]]
table = "audit.event"
kind = "exempt"
reason = """
The audit log every service writes, so tenant_id is null for a platform-wide action that no tenant
owns. Row-level security is enabled and forced all the same: event_tenant_isolation, the tenant
policy, lets a session read and write the rows of its app.tenant_id setting, and
event_platform_insert lets it insert a row with no tenant. Two FOR SELECT policies admit no write:
event_platform_read reads the rows of no tenant while app.audit_scope is 'regulatory', and
event_export_read reads every row while it is 'export'; only identity sets the scope, and only
cw_identity holds SELECT among the service roles. A trigger refuses UPDATE and DELETE (migrations
0005 and 0006 of identity, py_common.audit.schema).
"""

[[exemptions]]
table = "notification.channel_preference"
reason = """
Consent per channel and normalised address, recorded before any tenant links the address: an
opt-out typed on WhatsApp must be honoured for every tenant, so there is no tenant_id to isolate
by. It also holds when the address last wrote to us (migration 0001 of notification).
"""

[[exemptions]]
table = "notification.suppression"
reason = """
Addresses closed by a permanent bounce, a complaint or support, keyed by channel and address: a
closed address holds for every tenant that sends to it, so there is no tenant_id (migration 0001
of notification).
"""

[[exemptions]]
table = "notification.address_directory"
reason = """
Routes a normalised address to the tenants and recipients that registered it, for inbound messages
and receipts that name only the address, and lists the tenants the retention sweep visits one
tenant unit at a time. It holds ids and addresses, no message content (migration 0001 of
notification).
"""

[[exemptions]]
table = "notification.work_index"
reason = """
The dispatch queue across tenants: the dispatcher claims due entries with FOR UPDATE SKIP LOCKED
before it knows their tenant, then handles each in a unit of work of the entry's tenant, and
receipts find their tenant by the provider's message id. It holds ids and times, no message
content (migration 0001 of notification).
"""

[[exemptions]]
table = "obligation.obligation_tenant"
kind = "routing_directory"
reason = """
The tenants that have obligations, which the reminder sweep reads before it knows a tenant and
then visits one tenant unit of work at a time. Every session may read the ids; every write must
pass the tenant policy. It holds tenant ids only (migration 0003 of obligation).
"""

[[exemptions]]
table = "applicability.business_directory"
kind = "routing_directory"
reason = """
Every business node the applicability engine heard of, with its tenant, level and parent, which a
fan-out over every business reads before it knows a tenant and then visits one tenant unit of work
at a time. Every session may read the ids; every write must pass the tenant policy. It holds ids
and levels only (migration 0002 of applicability-engine).
"""

[[exemptions]]
table = "applicability.fanout_run"
kind = "exempt"
reason = """
One row per published rule version's fan-out over every tenant's businesses: its status, counters
and who last paused, resumed or cancelled it. The run belongs to the rule version, not to a
tenant, so there is no tenant_id; it holds ids, counts and reasons, no tenant data (migration 0003
of applicability-engine).
"""

[[exemptions]]
table = "applicability.fanout_hold"
kind = "exempt"
reason = """
The one global hold that stops every fan-out at its next batch boundary, with its reason, who set
it and when. It belongs to no tenant, so there is no tenant_id (migration 0003 of
applicability-engine).
"""

[[exemptions]]
table = "obligation.rule_version_ref"
kind = "exempt"
reason = """
The rule versions obligations come from, cached from the rulebook: status, effective dates, the
approvers of the published round and the verified citations. Rule-level data, the same for every
tenant, so there is no tenant_id; it holds nothing of a tenant (migration 0004 of obligation).
"""

[[exemptions]]
table = "pipeline.source"
kind = "exempt"
reason = """
The regulator sources the pipeline reads: the adapter type with its parameters, the cadence and
how far the last crawl got. Global regulatory data, the same for every tenant, so there is no
tenant_id; it holds nothing of a tenant (migration 0001 of pipeline).
"""

[[exemptions]]
table = "pipeline.raw_document"
kind = "exempt"
reason = """
One row per fetched regulator file, keyed by the SHA-256 of its bytes, with where it came from
and its key in the raw store. Global regulatory data, the same for every tenant, so there is no
tenant_id; it holds nothing of a tenant (migration 0001 of pipeline).
"""

[[exemptions]]
table = "pipeline.crawl_run"
kind = "exempt"
reason = """
One crawl of one regulator source: when it ran, its counts and how it ended. Global regulatory
data, the same for every tenant, so there is no tenant_id; it holds nothing of a tenant (migration
0001 of pipeline).
"""

[[exemptions]]
table = "pipeline.pipeline_task"
kind = "exempt"
reason = """
Work a person does on a stored regulator document, a manual parse of one no parser reads or a
triage, with who resolved it and how. Global regulatory data, the same for every tenant, so there
is no tenant_id; it holds nothing of a tenant (migration 0003 of pipeline).
"""

[[exemptions]]
table = "pipeline.document_classification"
kind = "exempt"
reason = """
How each parsed regulator document was classified: its type, whether it is a regulatory document,
how sure the type is and why, by the detector or an analyst's triage. Global regulatory data, the
same for every tenant, so there is no tenant_id; it holds nothing of a tenant (migration 0004 of
pipeline).
"""

[[exemptions]]
table = "pipeline.rule_extraction"
kind = "exempt"
reason = """
The rule candidate the model gave for one regulator document and prompt version, with the
validators' issues. Global regulatory data, the same for every tenant, so there is no tenant_id;
it holds nothing of a tenant (migration 0004 of pipeline).
"""

[[exemptions]]
table = "pipeline.document_retry"
kind = "exempt"
reason = """
A person's retry of a stored regulator document: the attempt, the stage its ingest starts again
from, the type the person gave it, why and by whom. Global regulatory data, the same for every
tenant, so there is no tenant_id; it holds nothing of a tenant (migration 0005 of pipeline).
"""

[[exemptions]]
table = "rulebook.review_task"
kind = "exempt"
reason = """
One review of one rule version: its queue position (regulator, priority), who claimed it and who
decided what. Regulatory work on the rulebook every tenant reads, so there is no tenant_id; it
holds analyst ids and notes, nothing of a tenant (migration 0009 of rulebook).
"""

[[exemptions]]
table = "rulebook.rule_candidate"
kind = "exempt"
reason = """
One rule candidate the pipeline extracted from a regulator document (rule.candidate.created), with
its scores, the candidate itself and where its review got to. Global regulatory data, the same for
every tenant, so there is no tenant_id; it holds analyst ids, nothing of a tenant (migration 0010 of
rulebook).
"""
