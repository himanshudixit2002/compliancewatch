# Migration lint, catalog mode (infra/scripts/check_migrations.py, `make migrations-catalog`).
#
# Rules, checked after every service has migrated:
#   R1  a NOT NULL tenant_id means row-level security enabled and forced, and a policy for ALL
#       commands whose USING and WITH CHECK compare tenant_id with
#       NULLIF(current_setting('app.tenant_id', true), ''); the only other permissive policy
#       allowed is a purge policy, FOR DELETE USING (expires_at < now()) (idempotency keys);
#   R2  every table in a tenant schema has tenant_id;
#   R3  a nullable tenant_id only on an exempt table;
#   R4  every exemption below matches at least one table.
# A table in a schema listed in neither group fails too.
#
# Exemptions are append-only and land in the same pull request as the migration that needs
# them, each with the reason the report prints. `table` is schema.table and may use * for any
# schema. `kind` is "exempt" (the default: R1 to R3 are skipped) or "routing_directory" (reads
# may cross tenants, but every policy that admits a write must hold the tenant check).

[schemas]
# Customer data: every table carries tenant_id under row-level security.
tenant = ["identity", "profile", "obligation", "notification", "applicability", "qa"]
# Regulatory and platform data shared by every tenant. R1 and R3 still apply to any table here
# that has a tenant_id column.
global = ["rulebook", "pipeline", "llm_gateway", "eval", "audit"]

[[exemptions]]
table = "*.outbox_event"
reason = """
The outbox relay reads pending rows across tenants, and tenant_id is null for regulatory events
(py_common.outbox).
"""

[[exemptions]]
table = "*.processed_event"
reason = """
Consumer inbox keyed by consumer group and event id: it records which events were handled and
holds no tenant data (py_common.outbox).
"""

[[exemptions]]
table = "*.alembic_version"
reason = "Alembic's version table: one row naming the schema's migration head."

[[exemptions]]
table = "llm_gateway.cost_ledger"
reason = """
Row-level security is deliberately not applied: the cost dashboard reads this table across
tenants and tenant_id is NULL for regulatory calls (migration 0001 of llm-gateway).
"""

[[exemptions]]
table = "identity.channel_consent"
reason = """
Keyword opt-ins and opt-outs keyed by phone number, recorded when a person writes to the WhatsApp
number before any tenant owns it, so there is no tenant_id to isolate by. Only identity's
service-token routes read or write it, and a trigger keeps it append-only (migration 0002 of
identity).
"""

[[exemptions]]
table = "identity.tenant"
reason = """
The tenant table is the tenant itself, so it has no tenant_id: row-level security is enabled and
forced with a policy on id, which admits the tenant the app.tenant_id setting names and no other
(migration 0003 of identity).
"""

[[exemptions]]
table = "identity.user_subject"
reason = """
Which user, in which tenant, an identity provider's subject signs in as. The session exchange reads
it before it knows the tenant, so no tenant setting can apply; it holds ids only (migration 0003 of
identity).
"""

[[exemptions]]
table = "identity.service_client"
reason = """
Service clients belong to no tenant, so there is no tenant_id. It holds client ids, the SHA-256 of
each secret and the scopes, never a secret (migration 0003 of identity).
"""

[[exemptions]]
table = "notification.channel_preference"
reason = """
Consent per channel and normalised address, recorded before any tenant links the address: an
opt-out typed on WhatsApp must be honoured for every tenant, so there is no tenant_id to isolate
by. It also holds when the address last wrote to us (migration 0001 of notification).
"""

[[exemptions]]
table = "notification.suppression"
reason = """
Addresses closed by a permanent bounce, a complaint or support, keyed by channel and address: a
closed address holds for every tenant that sends to it, so there is no tenant_id (migration 0001
of notification).
"""

[[exemptions]]
table = "notification.address_directory"
reason = """
Routes a normalised address to the tenants and recipients that registered it, for inbound messages
and receipts that name only the address, and lists the tenants the retention sweep visits one
tenant unit at a time. It holds ids and addresses, no message content (migration 0001 of
notification).
"""

[[exemptions]]
table = "notification.work_index"
reason = """
The dispatch queue across tenants: the dispatcher claims due entries with FOR UPDATE SKIP LOCKED
before it knows their tenant, then handles each in a unit of work of the entry's tenant, and
receipts find their tenant by the provider's message id. It holds ids and times, no message
content (migration 0001 of notification).
"""

[[exemptions]]
table = "obligation.obligation_tenant"
kind = "routing_directory"
reason = """
The tenants that have obligations, which the reminder sweep reads before it knows a tenant and
then visits one tenant unit of work at a time. Every session may read the ids; every write must
pass the tenant policy. It holds tenant ids only (migration 0003 of obligation).
"""
