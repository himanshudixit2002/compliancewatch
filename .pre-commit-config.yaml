# pre-commit (https://pre-commit.com). One-time setup: `make hooks` (= pre-commit install --install-hooks).
# Install pre-commit itself with `brew install pre-commit` or `uv tool install pre-commit`.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/helm/.*/templates/ # Go-templated YAML is not valid YAML
      - id: check-added-large-files
        # Recorded regulator PDFs are stored as base64 JSON and reach about 500 KB.
        args: [--maxkb=600]
      - id: check-merge-conflict

  # Python (ruff config lives in the root pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # TypeScript side: prettier in a hermetic node env, so committing never requires `pnpm install`.
  # Version must match "prettier" in the root package.json. .prettierignore is honoured (hooks run from the root).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        files: \.(ts|tsx|mts|cts|js|mjs|cjs|jsx|json|ya?ml|css)$

  # Secrets (guide section 13). Built from source on first run (pre-commit downloads Go if absent);
  # switch to `id: gitleaks-system` if you prefer `brew install gitleaks`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Conventional Commits on local commit messages; CI checks the PR title (the squash commit).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, chore, refactor, test, ci, build, perf, revert, style]
