    answer: "No. Notification No. 15/2025-Central Tax exempts a registered person whose aggregate turnover in the financial year is up to two crore rupees from filing the annual return for that year, from 2024-25 onwards; one crore rupees is within that limit."
    citations:
    - document: n15_2025
