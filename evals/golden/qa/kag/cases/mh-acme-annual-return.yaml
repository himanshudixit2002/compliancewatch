    answer: "No. Notification No. 15/2025-Central Tax exempts only a registered person whose aggregate turnover in the financial year is up to two crore rupees; Acme Bengaluru's profile places its turnover above the band of 1.5 crore to 2 crore rupees, so the annual return rule applies to it."
