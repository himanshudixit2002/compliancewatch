  answer:
    covered: true
    answer: "In the rulebook, two notifications: No. 01/2026-Central Tax extended the due date for FORM GSTR-3B for March 2026 till 21 April 2026, and No. 17/2025-Central Tax extended it for September 2025 and for the quarter July to September 2025 till 25 October 2025."
    citations:
    - document: n01_2026
      clause_ref: en.p3
      quote: "hereby extends the due date for furnishing the return in FORM GSTR-3B for the month of March, 2026 till the twenty -first day of April, 2026"
    - document: n17_2025
      clause_ref: en.p5
      quote: "(i) sub-section (1) of section 39, for the month of September,2025, till twenty-fifth day of October, 2025"
    - document: n17_2025
      clause_ref: en.p6
      quote: "(ii) proviso to sub-section (1) of section 39, for the quarter of July, 2025 to September, 2025, till twenty-fifth day of October, 2025."
