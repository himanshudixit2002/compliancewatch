    text: '[TO BE PUBLISHED IN THE GAZETTE OF INDIA, EXTRAORDINARY, PART II, SECTION 3, SUB-SECTION (i)]'
  - ref: en.p2
    page: 1
    text: GOVERNMENT OF INDIA MINISTRY OF FINANCE DEPARTMENT OF REVENUE CENTRAL BOARD OF INDIRECT TAXES
      AND CUSTOMS
  - ref: en.p3
    page: 1
    text: NOTIFICATION No. 17/2025 – CENTRAL TAX New Delhi, the 18 October, 2025
  - ref: en.p4
    page: 1
    text: G.S.R.....(E).- In  exercise  of  the  powers  conferred  by  sub-section  (6) of  section 39
      read with section 168 of  the  Central  Goods  and Services  Tax  Act,  2017  (12  of 2017),  the  Commissioner,  on  the  recommendations  of  the  Council,
      hereby extends the time limit for furnishing the return in FORM GSTR-3B electronically, through
      the common portal, by the registered persons, as specified under:-
  - ref: en.p5
    page: 1
    text: '(i) sub-section (1) of section 39, for the month of September,2025, till twenty-fifth day of
      October, 2025:'
  - ref: en.p6
    page: 1
    text: (ii) proviso to sub-section (1) of section 39, for the quarter of July, 2025 to September, 2025,
      till twenty-fifth day of October, 2025.
  - ref: en.p7
    page: 1
    text: '[F. No. CBIC-20006/45/2025-GST]'
  - ref: en.p8
    page: 1
    text: (Raushan Kumar) Under Secretary
