  - ref: en.p2
    page: 1
    text: GOVERNMENT OF INDIA MINISTRY OF FINANCE (DEPARTMENT OF REVENUE) CENTRAL BOARD OF INDIRECT TAXES
      AND CUSTOMS
  - ref: en.p3
    page: 1
    text: NOTIFICATION No. 13/2024 – Central Tax
  - ref: en.p4
    page: 1
    text: New Delhi, the 10th July, 2024 G.S.R. ......(E).— In pursuance of the powers conferred by sub
      -rule (4B) of rule 8 of the Central Goods and Services Tax Rules, 2017, the Central Government,
      on the recommendations of the Council, hereby rescinds the notification of the Government of India
      in the Ministry of Finance, Department of Revenue, number 27/2022 - Central Tax, dated the 26 th
      December, 2022 published vide number G.S.R 903(E), in the Gazette of India, Extraordinary, Part
      II, Section 3, Sub -section (i), dated the 26 th December, 2022, except as respects things done
      or omitted to be done before such rescission.
  - ref: en.p5
    page: 1
    text: 2. This notification shall come into force from the date of its publication in Official Gazette.
