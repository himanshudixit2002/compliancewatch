[project]
name = "compliancewatch-evals"
version = "0.1.0"
description = "ComplianceWatch eval harness: golden sets in, metrics and a pass or fail against the thresholds out"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0",
  "httpx2>=2.13",
  "fastapi>=0.120",
  "py-common",
  "domain-kernel",
  "ontology",
  "compliancewatch-pipeline",
  "compliancewatch-llm-gateway",
]

[project.scripts]
eval-harness = "cw_evals.run:main"

[tool.uv.sources]
py-common = { workspace = true }
domain-kernel = { workspace = true }
ontology = { workspace = true }
compliancewatch-pipeline = { workspace = true }
compliancewatch-llm-gateway = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cw_evals"]
