# gitleaks configuration (guide section 13: secrets never in the repo).
# Picked up automatically by the pre-commit hook (repo root) and via GITLEAKS_CONFIG in CI.
[extend]
useDefault = true

[[allowlists]]
description = "Placeholder env files and lockfiles: empty keys and integrity hashes, not secrets"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
]

[[allowlists]]
description = "Rule keys: identifiers such as gstr3b_monthly, not credentials (YAML, Python and JSON keys)"
regexTarget = "line"
regexes = [
  '''rule_key"?\s*(?:==|:|=)\s*"?[a-z][a-z0-9_]*"?''',
]

[[allowlists]]
description = "Raw store keys: <ab>/<sha256> names the SHA-256 of a fetched file's bytes, not a credential (pipeline workflow histories)"
regexes = [
  '''^(?:[A-Za-z0-9!_.*'()-]+/)*[0-9a-f]{2}/[0-9a-f]{64}$''',
]
