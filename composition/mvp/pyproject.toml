[project]
name = "compliancewatch-mvp"
version = "0.1.0"
description = "ComplianceWatch composition root (ADR-013): every service in one deployable, an app process with a public and an internal listener, and a worker process"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "starlette>=0.47",
  "uvicorn[standard]>=0.35",
  "anyio>=4.9",
  "httpx2>=2.13",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "structlog>=25.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "temporalio>=1.34,<1.35",
  "opentelemetry-api==1.45.0",
  "py-common",
  "domain-kernel",
  "ontology",
  "compliancewatch-contracts",
  "compliancewatch-identity",
  "compliancewatch-profile",
  "compliancewatch-rulebook",
  "compliancewatch-applicability-engine",
  "compliancewatch-obligation",
  "compliancewatch-notification",
  "compliancewatch-qa",
  "compliancewatch-llm-gateway",
  "compliancewatch-eval",
  "compliancewatch-pipeline",
]

[project.scripts]
cw-mvp = "cw_mvp.cli:main"

[tool.uv.sources]
py-common = { workspace = true }
domain-kernel = { workspace = true }
ontology = { workspace = true }
compliancewatch-contracts = { workspace = true }
compliancewatch-identity = { workspace = true }
compliancewatch-profile = { workspace = true }
compliancewatch-rulebook = { workspace = true }
compliancewatch-applicability-engine = { workspace = true }
compliancewatch-obligation = { workspace = true }
compliancewatch-notification = { workspace = true }
compliancewatch-qa = { workspace = true }
compliancewatch-llm-gateway = { workspace = true }
compliancewatch-eval = { workspace = true }
compliancewatch-pipeline = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cw_mvp"]
