# The service clients the identity service creates in local and test runs (EnsureDevServiceClients),
# all with the one dev secret CW_IDENTITY_DEV_CLIENT_SECRET. Each caller runs with
# CW_SERVICE_CLIENT_ID set to its client id (the Makefile's run and worker targets default it to the
# service name) and CW_SERVICE_CLIENT_SECRET set to the dev secret. CW_IDENTITY_DEV_CLIENTS replaces
# this list, as client=scope+scope,client=scope.
#
# A caller that starts calling another service adds its line here in the same change, with the
# scopes that call needs and no more. Staging and production create their clients with
# identity-admin service-client create instead; nothing here reaches them.

[applicability-engine]
scopes = ["tenant:act"]
reason = "evaluates a rule version for a tenant's business, and recomputes a business on profile.updated: reads the business, its registrations and their profile snapshots for that tenant, and the published rule versions, whose read routes need no scope"

[notification]
scopes = ["tenant:act"]
reason = "reads the rule versions its messages cite from the rulebook, whose read routes need no scope, and for a CA firm's bulk notification the open obligations of the firm's clients at the obligation service for that tenant"

[obligation]
scopes = ["tenant:act"]
reason = "checks that the user a member assigns an obligation to belongs to the tenant, and that a business with no obligation on a page of the public list is the tenant's: reads the user's membership at identity and the business's node at profile for that tenant, and the rule versions, whose read routes need no scope"

[pipeline]
scopes = ["rulebook:write", "llm:call", "tenant:act"]
reason = "writes extracted documents, mentions and relation candidates to the rulebook and calls the gateway, naming a tenant only when it attributes cost"

[qa]
scopes = ["llm:call", "tenant:act"]
reason = "answers a tenant's question: reads the tenant's profile and obligations and calls the gateway for that tenant"

[whatsapp-bot]
scopes = ["notification:preferences", "notification:receipts", "identity:channel-consents", "tenant:act"]
reason = "records keyword consents at identity, reads and changes channel preferences and reports delivery receipts to notification"

[worker]
scopes = ["rulebook:write", "llm:call", "tenant:act", "notification:send", "entitlements:read", "data:export"]
reason = "the combined worker process (cw-mvp worker) runs every service's consumers, jobs and activities under one client: pipeline writes and model calls, engine and notification reads for a tenant, sends, plan checks and exports"
