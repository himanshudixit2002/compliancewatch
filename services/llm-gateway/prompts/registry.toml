# Prompt registry of the llm-gateway service.
#
# A caller names a prompt as name@version; the gateway refuses anything not listed here. Every
# entry has an owner and at least one eval case. version is text so that 1.10 and 1.1 stay
# distinct. sha256 is the digest of the prompt text and is filled in once the text exists.

[[prompts]]
name = "smoke.echo"
version = "1"
owner = "ai-platform"
eval_cases = 1
description = "Deterministic echo served by the fake provider; used by tests and the smoke route."

[[prompts]]
name = "extraction.rule_candidate"
version = "1"
owner = "regulatory-intelligence"
eval_cases = 1
sha256 = "8c31ce19b6225847eb097ed785869bdb68e3208c8c006cc3f3c858d3565d75ce"
description = "Rule candidate from one parsed document; text in services/pipeline/prompts/extraction.rule_candidate.v1.md, cases in evals/golden/extraction."

[[prompts]]
name = "extraction.rule_relations"
version = "1"
owner = "regulatory-intelligence"
