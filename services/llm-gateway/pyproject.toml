[project]
name = "compliancewatch-llm-gateway"
version = "0.1.0"
description = "ComplianceWatch llm-gateway service: provider routing, prompt registry, cost ledger, budgets, tracing"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "py-common",
  "domain-kernel",
  "openai>=3.19",
  "langfuse>=2.60,<3",
]

[tool.uv.sources]
py-common = { workspace = true }
domain-kernel = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
