[project]
name = "compliancewatch-profile"
version = "0.1.0"
description = "ComplianceWatch profile service: the business hierarchy (entity, registration, location), attribute values per node and financial year, snapshots for the engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "py-common",
  "domain-kernel",
  "ontology",
]

[project.scripts]
profile-fy-confirm = "profile_service.jobs:main"

[tool.uv.sources]
py-common = { workspace = true }
domain-kernel = { workspace = true }
ontology = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_service"]
