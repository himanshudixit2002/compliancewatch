[project]
name = "compliancewatch-rulebook"
version = "0.1.0"
description = "ComplianceWatch rulebook service: versioned rules, clauses, knowledge entities and relations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "opentelemetry-api==1.45.0",
  "py-common",
  "domain-kernel",
  "ontology",
  "compliancewatch-contracts",
  "pyyaml>=6.0",
]

[project.scripts]
rulebook-golden-export = "rulebook.golden:main"
rulebook-seed = "rulebook.seed:main"
rulebook-quality = "rulebook.quality:main"
rulebook-transitions = "rulebook.transitions:main"

[tool.uv.sources]
py-common = { workspace = true }
domain-kernel = { workspace = true }
ontology = { workspace = true }
compliancewatch-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulebook"]
