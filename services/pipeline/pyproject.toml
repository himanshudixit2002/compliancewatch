[project]
name = "compliancewatch-pipeline"
version = "0.1.0"
description = "ComplianceWatch pipeline service: regulatory documents in, rule candidates out, as Temporal workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "py-common",
  "domain-kernel",
  "httpx2>=2.13",
  "pypdf>=6.0",
  "pyyaml>=6.0",
  "ontology",
]

[project.scripts]
pipeline-backfill = "pipeline.backfill:main"
pipeline-embed = "pipeline.embed:main"
pipeline-label = "pipeline.label:main"

[tool.uv.sources]
py-common = { workspace = true }
domain-kernel = { workspace = true }
ontology = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
