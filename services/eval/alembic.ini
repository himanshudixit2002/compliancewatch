# Alembic configuration for the eval service.
# sqlalchemy.url is NOT set here: migrations/env.py reads it from py_common.settings (CW_DATABASE_URL)
# and CW_DB_SCHEMA selects the service schema. Run from the repo root:
#   uv run --package compliancewatch-eval alembic -c services/eval/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
version_path_separator = os
